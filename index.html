<script>
'use strict';
/* =====================================================================
   전역 설정 — 속도·이징·지속시간·입자 수·모형 매개변수는 여기서 수정
   ===================================================================== */
const CONFIG = {
  stage: { width: 1920, height: 1080 },

  particles: {
    count: 500,        // 전 장면에서 살아 있는 입자 수 (= 경제 주체 수)
    speed: 1,          // 전체 운동 속도 배율
    trailLength: 40    // 궤적 기록 길이(프레임)
  },

  animation: {
    duration: 1200,                    // 선 변형·텍스트 전환 시간(ms)
    easing: [0.22, 0.75, 0.25, 1.08],  // cubic-bezier (끝에서 약간 오버슈트)
    overshoot: 0.04                    // 입자 스프링의 오버슈트 비율
  },

  gas: { v0: 115, radius: 5, temperature: 1 },

  exchange: {
    initial: 100,        // 1인당 초기 자산 (= 평균 자산)
    saving: 0.5,         // 03 장면: 거래할 때 남겨 두는 비율 λ
    rates: [1.5, 400],   // 03 장면 단계별 초당 거래 수
    yardFraction: 0.25,  // 05 장면: 판돈 = 가난한 쪽 자산의 이 비율
    rateYard: [400, 20000],
    maxRoutes: 70
  },

  quantum: {
    temperature: 1.8,   // 04 장면 시작 온도 (T / Tc 단위)
    tCold: 0.3,         // 식힌 뒤 온도
    energyLevels: 20,   // 에너지 준위 수 (3차원 조화 트랩, ε_k = k·ħω, 축퇴도 g_k=(k+1)(k+2)/2)
    particleCount: 500
  },

  data: { window: 400, column: '', label: 'S&P 500 월별 지수 1996–2012 (Shiller)' },   // 내장 CSV 설명 / 표시할 최근 표본 수 / 열 이름(선택)

  performance: { targetFPS: 60, maxDPR: 2, maxBackingWidth: 3840, adaptive: true }
};

/* ---------- 유틸 ---------- */
const W = CONFIG.stage.width, H = CONFIG.stage.height;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srnd = mulberry32(20240917);            // 배치·시계열용 고정 시드 (발표마다 같은 그림)
function gauss(r){r=r||Math.random;let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*r())}
function bezierEase(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const f=((ax*t+bx)*t+cx)*t-x,d=(3*ax*t+2*bx)*t+cx; if(Math.abs(d)<1e-6)break; t-=f/d;}
    t=clamp(t,0,1); return ((ay*t+by)*t+cy)*t; };
}
const EASE = bezierEase.apply(null, CONFIG.animation.easing);
const SANS = 'Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding","Liberation Mono",monospace';
const SERIF = '"STIX Two Text","Times New Roman","Nimbus Roman",Times,serif';


/* ---------- DOM ---------- */
const stage = document.getElementById('stage'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mBL = document.getElementById('mBL'), notesEl = document.getElementById('notes');
stage.style.setProperty('--ease', 'cubic-bezier(' + CONFIG.animation.easing.join(',') + ')');
stage.style.setProperty('--dur', CONFIG.animation.duration + 'ms');
let K = 1, quality = 1;
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxDPR);
  const bw = clamp(Math.round(W * s * dpr * quality), 640, CONFIG.performance.maxBackingWidth);
  if (cv.width !== bw){ cv.width = bw; cv.height = Math.round(bw * H / W); }
  K = bw / W;
}
addEventListener('resize', resize); resize();

/* =====================================================================
   입자 시스템 — 프레젠테이션 전체에서 단 하나의 인스턴스
   ===================================================================== */
const N = CONFIG.particles.count, TL = CONFIG.particles.trailLength;
const F = () => new Float32Array(N);
const px=F(),py=F(),vx=F(),vy=F(),ax=F(),ay=F();           // 위치·속도·가속도
const col=F(),colT=F(),siz=F(),sizT=F(),alp=F(),alpT=F();   // 색상(0..1 램프)·크기·불투명도
const kf=F(),sd=F(),sd2=F(),g1=F(),g2=F();                  // 개체별 난수
const trail=new Float32Array(N*TL*2); let th=0;             // 궤적 기록(링 버퍼)
const st=new Uint8Array(N);
const skyX=F(),skyY=F(),mapU=F(),mapV=F(),gx=F(),gy=F();
const HORIZON = 640;

(function initParticles(){
  for(let i=0;i<N;i++){
    kf[i]=0.8+0.45*srnd(); sd[i]=srnd(); sd2[i]=srnd(); g1[i]=gauss(srnd); g2[i]=gauss(srnd);
    skyX[i]=40+srnd()*(W-80); skyY[i]=50+Math.pow(srnd(),1.25)*540;
  }
  // 사람의 자리: 0..1 정규 좌표에 best-candidate 표본 추출로 고르게 배치
  for(let i=0;i<N;i++){
    let bx=0,by=0,bd=-1;
    for(let c=0;c<12;c++){
      const x=srnd(),y=srnd(); let d=1e9;
      for(let j=0;j<i;j++){const dx=(mapU[j]-x)*1.5,dy=mapV[j]-y,q=dx*dx+dy*dy; if(q<d)d=q;}
      if(d>bd){bd=d;bx=x;by=y;}
    }
    mapU[i]=bx; mapV[i]=by;
  }
  for(let i=0;i<N;i++){
    px[i]=skyX[i]; py[i]=skyY[i]; col[i]=colT[i]=0.6; siz[i]=sizT[i]=1.6; alp[i]=alpT[i]=0.4;
    for(let k=0;k<TL;k++){trail[(i*TL+k)*2]=px[i];trail[(i*TL+k)*2+1]=py[i];}
  }
})();

const OS = clamp(CONFIG.animation.overshoot, 0.001, 0.5), LOS = Math.log(OS);
const ZETA = -LOS / Math.sqrt(Math.PI*Math.PI + LOS*LOS);
const OMEGA = 6000 / CONFIG.animation.duration;
function spring(i, X, Y, dt, w){
  const o = OMEGA * kf[i] * (w || 1), c = 2 * ZETA * o;
  ax[i] = o*o*(X-px[i]) - c*vx[i]; ay[i] = o*o*(Y-py[i]) - c*vy[i];
  vx[i] += ax[i]*dt; vy[i] += ay[i]*dt; px[i] += vx[i]*dt; py[i] += vy[i]*dt;
}

/* ---------- 장면 매개변수 (연속적으로 보간) ---------- */
const DEF = { warm:0, light:0, trail:8, star:1, tipA:0, tipB:0, lineA:1, gasHist:0, mHist:0, trap:0, plotFr:0,
  bx:120, by:170, bw:860, bh:720 };            // 왼쪽 틀 (기체 상자 = 사람들이 놓이는 자리)
const WIDE = { bx:120, by:150, bw:1680, bh:740 };
const P = Object.assign({}, DEF), PT = Object.assign({}, DEF);
const V = { gasT:CONFIG.gas.temperature, exRate:1.5, rule:'saving', lam:CONFIG.exchange.saving, qT:CONFIG.quantum.temperature };
let mode = 'sky', T = 0, lightK = 0;

/* =====================================================================
   시계열 (00) — A: 브라운 운동, B: 주가 (CSV 없으면 시뮬레이션)
   ===================================================================== */
const LM = 400;
const serA = new Float32Array(LM), serB = new Float32Array(LM);
const nrmA = {m:0,r:1}, nrmB = {m:0,r:1};
let csvMode = false, csvName = '', csvCount = 0, serFrac = 0;
const gbm = { logS: 0, s2: 1, r: 0 };
function stepA(prev){ return prev + gauss(srnd); }
function stepB(){ // GARCH(1,1) 변동성을 갖는 기하 확률보행 (모의 주가)
  gbm.s2 = 0.06 + 0.10*gbm.r*gbm.r + 0.86*gbm.s2; gbm.r = Math.sqrt(gbm.s2)*gauss(srnd);
  gbm.logS += 0.011*gbm.r + 0.0002; return Math.exp(gbm.logS);
}
(function(){ let a=0; for(let i=0;i<LM;i++){a=stepA(a);serA[i]=a;serB[i]=stepB();} })();
function normOf(s, o, snap){
  let mn=1e30,mx=-1e30; for(let i=0;i<LM;i++){if(s[i]<mn)mn=s[i];if(s[i]>mx)mx=s[i];}
  const m=(mn+mx)/2, r=Math.max(1e-9,(mx-mn)/2);
  if(snap){o.m=m;o.r=r;} else {o.m+=(m-o.m)*0.06;o.r+=(r-o.r)*0.06;}
}
normOf(serA,nrmA,true); normOf(serB,nrmB,true);
function tickSeries(dt){
  normOf(serA,nrmA,false); normOf(serB,nrmB,false);
  if(csvMode){ serFrac=0; return; }
  serFrac += dt*9*CONFIG.particles.speed;
  while(serFrac>=1){ serFrac-=1; serA.copyWithin(0,1); serB.copyWithin(0,1);
    serA[LM-1]=stepA(serA[LM-2]); serB[LM-1]=stepB(); }
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];}
    else if(c!=='\r') cell+=c; }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  const num=s=>{const v=parseFloat(String(s).replace(/[,\s%₩$]/g,''));return isFinite(v)?v:NaN;};
  const data=rows.filter(r=>r.some(c=>c.trim()!=='')); if(data.length<3) return null;
  const head=data[0], hasHead=head.some(c=>isNaN(num(c))&&c.trim()!=='');
  let ci=-1;
  if(hasHead){ const want=CONFIG.data.column.toLowerCase();
    head.forEach((h,i)=>{const s=h.trim().toLowerCase(); if(want?s===want:/^(adj\.?\s*)?close$|종가|^price$|^value$|지수/.test(s)) ci=i;}); }
  const body=hasHead?data.slice(1):data;
  if(ci<0){ for(let i=body[0].length-1;i>=0;i--){ if(!isNaN(num(body[0][i]))&&!/^\d{4}[-/.]\d/.test(body[0][i].trim())){ci=i;break;} } }
  if(ci<0) return null;
  let vals=body.map(r=>num(r[ci])).filter(v=>!isNaN(v)&&v>0);
  const d0=Date.parse(body[0][0]), d1=Date.parse(body[body.length-1][0]);
  if(isFinite(d0)&&isFinite(d1)&&d0>d1) vals.reverse();      // 최신순 CSV면 뒤집는다
  return vals.length>=20?vals:null;
}
function applyCSV(text, name){
  const v=parseCSV(text); if(!v) return false;
  const w=v.slice(-Math.max(20,CONFIG.data.window));
  for(let i=0;i<LM;i++){ const p=i/(LM-1)*(w.length-1), a=Math.floor(p), b=Math.min(w.length-1,a+1); serB[i]=lerp(w[a],w[b],p-a); }
  const walk=[0]; for(let i=1;i<w.length;i++) walk.push(walk[i-1]+gauss(srnd));     // 왼쪽 브라운 운동도 같은 걸음 수로 다시 만든다
  for(let i=0;i<LM;i++){ const p=i/(LM-1)*(walk.length-1), a=Math.floor(p), b=Math.min(walk.length-1,a+1); serA[i]=lerp(walk[a],walk[b],p-a); }
  csvMode=true; csvName=name||'CSV'; csvCount=w.length; normOf(serA,nrmA,true); normOf(serB,nrmB,true); if(cur>=0) updateMeta(true); return true;
}


/* =====================================================================
   선 — 수평선 → 궤적 → 상자 → 축 → 분포 곡선 → 평등선 → 밑줄 로 이어지는 하나의 선
   ===================================================================== */
const GR = { x0:1100, x1:1800, base:860 };                         // 오른쪽 그래프 자리 (속력 분포와 돈 분포가 같은 자리에 그려진다)
const GH = { nb:32, scale:2600 };                                   // 속력 분포 막대
const MH = { nb:32, bw:CONFIG.exchange.initial/10, px:6.6 };        // 돈 분포 막대 (px: 한 사람당 높이)
const SER = { aX0:160, aX1:880, bX0:1040, bX1:1760, cy:520, amp:170, fy:790 };
const QL = CONFIG.quantum.energyLevels, QN = Math.min(N, CONFIG.quantum.particleCount);
const TRAP = { cx:580, yb:900, dy:Math.min(36, 684/(QL-1)), wmax:400 };
const PLOT = { x0:1180, x1:1800, y0:290, y1:840 };
const levY = k => TRAP.yb - k*TRAP.dy;
const levW = e => TRAP.wmax*Math.sqrt(Math.max(0,(e+0.6)/(QL-0.4)));

function seriesShape(o, s, nm, x0, x1){
  for(let i=0;i<LM;i++){ o[2*i]=x0+Math.max(0,(i-serFrac))/(LM-1)*(x1-x0); o[2*i+1]=SER.cy-(s[i]-nm.m)/nm.r*SER.amp; }
}
function lgamma(x){ const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x, t=x+5.5; t-=(x+0.5)*Math.log(t); let s=1.000000000190015; for(let j=0;j<6;j++) s+=c[j]/++y; return -t+Math.log(2.5066282746310005*s/x); }
// 저축률 λ 인 교환 모형의 정상 분포 근사: 감마 분포, 모양 모수 n = 1 + 3λ/(1-λ)  (Patriarca 외 2004)
function theoryDensity(m){ const Tm=CONFIG.exchange.initial, n=1+3*V.lam/(1-V.lam);
  return m<=0 ? (n>1.0001?0:1/Tm) : Math.exp(n*Math.log(n/Tm)+(n-1)*Math.log(m)-n*m/Tm-lgamma(n)); }
const SHAPES = {
  horizon(o){ for(let i=0;i<LM;i++){o[2*i]=-10+i/(LM-1)*(W+20);o[2*i+1]=HORIZON;} },
  serA(o){ seriesShape(o,serA,nrmA,SER.aX0,SER.aX1); },
  serB(o){ seriesShape(o,serB,nrmB,SER.bX0,SER.bX1); },
  box(o){ const bx=P.bx,by=P.by,bw=P.bw,bh=P.bh, per=2*(bw+bh);
    for(let i=0;i<LM;i++){ let d=i/(LM-1)*per,x,y;
      if(d<bw){x=bx+d;y=by;} else if((d-=bw)<bh){x=bx+bw;y=by+d;}
      else if((d-=bh)<bw){x=bx+bw-d;y=by+bh;} else {d-=bw;x=bx;y=by+bh-d;}
      o[2*i]=x;o[2*i+1]=y; } },
  maxwell(o){ const v0=CONFIG.gas.v0*CONFIG.particles.speed, vmax=6*v0, dv=vmax/GH.nb, s2=Math.max(0.02,gasTm)*v0*v0;   // 2차원 맥스웰 속력 분포
    for(let i=0;i<LM;i++){ const v=i/(LM-1)*vmax; o[2*i]=GR.x0+i/(LM-1)*(GR.x1-GR.x0);
      o[2*i+1]=GR.base-(v/s2)*Math.exp(-v*v/(2*s2))*dv*GH.scale; } },
  theory(o){ const mmax=MH.nb*MH.bw;
    for(let i=0;i<LM;i++){ const m=i/(LM-1)*mmax; o[2*i]=GR.x0+i/(LM-1)*(GR.x1-GR.x0); o[2*i+1]=GR.base-N*MH.bw*theoryDensity(m)*MH.px; } },
  parabola(o){ for(let i=0;i<LM;i++){ const s=-1+2*i/(LM-1), e=s*s*(QL-0.4)-0.6; o[2*i]=TRAP.cx+s*TRAP.wmax; o[2*i+1]=TRAP.yb-e*TRAP.dy; } },
  frac(o){ for(let i=0;i<LM;i++){ const p=i/(LM-1)*200,a=Math.floor(p),b=Math.min(200,a+1); o[2*i]=PLOT.x0+i/(LM-1)*(PLOT.x1-PLOT.x0);
      o[2*i+1]=PLOT.y1-lerp(Q.frac[a],Q.frac[b],p-a)*(PLOT.y1-PLOT.y0); } },
  dash(o){ for(let i=0;i<LM;i++){o[2*i]=900+i/(LM-1)*120;o[2*i+1]=560;} },
  mergeLine(o){ for(let i=0;i<LM;i++){o[2*i]=160+i/(LM-1)*1600;o[2*i+1]=560;} },
  underline(o){ for(let i=0;i<LM;i++){o[2*i]=204+i/(LM-1)*1730;o[2*i+1]=700;} },
  refLine(o){ for(let i=0;i<LM;i++){o[2*i]=204+i/(LM-1)*1730;o[2*i+1]=236;} }
};
class Line{
  constructor(shape){ this.cur=new Float32Array(LM*2); this.from=new Float32Array(LM*2); this.tgt=new Float32Array(LM*2);
    this.shape=shape; this.t=1; this.a=0; this.b=0; this.aT=0; this.bT=0; }
  set(shape){ if(shape===this.shape) return; this.from.set(this.cur); this.shape=shape; this.t=0; }
  jump(shape){ this.shape=shape; SHAPES[shape](this.tgt); this.cur.set(this.tgt); this.from.set(this.tgt); this.t=1; }
  update(dt){
    SHAPES[this.shape](this.tgt);
    if(this.t<1){ this.t=Math.min(1,this.t+dt*1000/CONFIG.animation.duration); const e=EASE(this.t),c=this.cur,f=this.from,g=this.tgt;
      for(let k=0;k<LM*2;k++) c[k]=f[k]+(g[k]-f[k])*e; }
    else this.cur.set(this.tgt);
    const k=1-Math.exp(-dt*3.4); this.a+=(this.aT-this.a)*k; this.b+=(this.bT-this.b)*k;
  }
  tip(){ const i=clamp(Math.round(this.b*(LM-1)),0,LM-1); return [this.cur[2*i],this.cur[2*i+1]]; }
  draw(color,width,alpha){
    const i0=Math.floor(this.a*(LM-1)), i1=Math.round(this.b*(LM-1)); if(i1-i0<1||alpha<0.01) return;
    const c=this.cur; ctx.beginPath(); ctx.moveTo(c[2*i0],c[2*i0+1]); for(let i=i0+1;i<=i1;i++) ctx.lineTo(c[2*i],c[2*i+1]);
    ctx.globalAlpha=alpha; ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  }
}

/* =====================================================================
   모형 ①  기체 상자 — 충돌로 에너지를 주고받는 분자들
   ===================================================================== */
let gasTm = 1; const gasHist = new Float32Array(GH.nb);
const GC = CONFIG.gas.radius*2.2, gcols = Math.ceil(DEF.bw/GC)+1, grows = Math.ceil(DEF.bh/GC)+1;
const ghead = new Int32Array(gcols*grows), gnext = new Int32Array(N);
function gasEnter(){ for(let i=0;i<N;i++){ st[i]=0; gx[i]=PT.bx+20+Math.random()*(PT.bw-40); gy[i]=PT.by+20+Math.random()*(PT.bh-40); } }
function collide(i,j){
  const dx=px[j]-px[i],dy=py[j]-py[i],d2=dx*dx+dy*dy,R2=4*CONFIG.gas.radius*CONFIG.gas.radius;
  if(d2>=R2||d2<1e-6) return; const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,rel=(vx[j]-vx[i])*nx+(vy[j]-vy[i])*ny;
  if(rel<0){ vx[i]+=rel*nx; vy[i]+=rel*ny; vx[j]-=rel*nx; vy[j]-=rel*ny; }     // 탄성 충돌: 두 분자의 에너지 합은 그대로
}
function mGas(dt){ const n=N;
  const v0=CONFIG.gas.v0*CONFIG.particles.speed, R=CONFIG.gas.radius; let ke=0,nf=0;
  const x0=P.bx+R,x1=P.bx+P.bw-R,y0=P.by+R,y1=P.by+P.bh-R;
  for(let i=0;i<n;i++){
    if(!st[i]){ spring(i,gx[i],gy[i],dt,1.3);
      const dx=gx[i]-px[i],dy=gy[i]-py[i];
      if(dx*dx+dy*dy<1600){ st[i]=1; const s=v0*Math.sqrt(V.gasT); vx[i]=gauss()*s; vy[i]=gauss()*s; } }
    else { px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      if(px[i]<x0){px[i]=x0;vx[i]=Math.abs(vx[i]);} else if(px[i]>x1){px[i]=x1;vx[i]=-Math.abs(vx[i]);}
      if(py[i]<y0){py[i]=y0;vy[i]=Math.abs(vy[i]);} else if(py[i]>y1){py[i]=y1;vy[i]=-Math.abs(vy[i]);}
      ke+=0.5*(vx[i]*vx[i]+vy[i]*vy[i]); nf++; }
  }
  ghead.fill(-1);
  for(let i=0;i<n;i++){ if(!st[i]) continue; const c=clamp(((py[i]-P.by)/GC)|0,0,grows-1)*gcols+clamp(((px[i]-P.bx)/GC)|0,0,gcols-1); gnext[i]=ghead[c]; ghead[c]=i; }
  for(let cy=0;cy<grows;cy++) for(let cx=0;cx<gcols;cx++){
    for(let i=ghead[cy*gcols+cx];i>=0;i=gnext[i]){
      for(let j=gnext[i];j>=0;j=gnext[j]) collide(i,j);
      if(cx+1<gcols) for(let j=ghead[cy*gcols+cx+1];j>=0;j=gnext[j]) collide(i,j);
      if(cy+1<grows){ for(let j=ghead[(cy+1)*gcols+cx];j>=0;j=gnext[j]) collide(i,j);
        if(cx>0) for(let j=ghead[(cy+1)*gcols+cx-1];j>=0;j=gnext[j]) collide(i,j);
        if(cx+1<gcols) for(let j=ghead[(cy+1)*gcols+cx+1];j>=0;j=gnext[j]) collide(i,j); }
    } }
  if(nf>0){ const Tm=ke/nf/(v0*v0); gasTm+=(Tm-gasTm)*0.2;
    const lam=Math.sqrt(clamp(1+dt/0.45*(V.gasT/Math.max(Tm,1e-4)-1),0.7,1.5));
    for(let i=0;i<n;i++) if(st[i]){vx[i]*=lam;vy[i]*=lam;} }
  const cnt=new Float32Array(GH.nb), vmax=6*v0;
  for(let i=0;i<n;i++){ const s=Math.hypot(vx[i],vy[i]); if(st[i]){const b=(s/vmax*GH.nb)|0; if(b<GH.nb)cnt[b]++;}
    colT[i]=st[i]?clamp(Math.pow(s/(3.3*v0),0.85),0,1):0.6; sizT[i]=4.2; alpT[i]=0.95; }
  for(let b=0;b<GH.nb;b++) gasHist[b]+=(cnt[b]/Math.max(1,nf)-gasHist[b])*0.06;
}

/* =====================================================================
   모형 ②  돈 교환 (총자산 일정, 음수 불가). 규칙:
     saving  각자 λ 만큼은 남겨 두고 나머지를 합쳐 무작위 비율로 다시 나눈다   (Chakraborti & Chakrabarti 2000)
     yard    동전 던지기 내기, 판돈은 가난한 쪽 자산의 일정 비율                 (Chakraborti 2002; Boghosian 2014)
   ===================================================================== */
const money = new Float64Array(N), monHist = new Float32Array(MH.nb);
let exCount = 0, exAcc = 0; const routes = [];
function exReset(){ money.fill(CONFIG.exchange.initial); exCount=0; exAcc=0; routes.length=0; }
exReset();
function exStep(dt){
  exAcc += V.exRate*dt*CONFIG.particles.speed; let n=Math.min(exAcc|0,600), budget=V.exRate>800?(Math.random()<0.45?1:0):2; exAcc=Math.min(exAcc-n,2);
  const yard=V.rule==='yard', f=CONFIG.exchange.yardFraction, lam=V.lam;
  for(;n>0;n--){
    const i=(Math.random()*N)|0; let j=(Math.random()*(N-1))|0; if(j>=i) j++;
    if(yard){ const d=f*Math.min(money[i],money[j]); if(Math.random()<0.5){money[i]+=d;money[j]-=d;} else {money[i]-=d;money[j]+=d;} }
    else { const tot=money[i]+money[j], pool=(1-lam)*tot, e=Math.random(); money[i]=lam*money[i]+e*pool; money[j]=tot-money[i]; }
    exCount++;
    if(budget-->0 && routes.length<CONFIG.exchange.maxRoutes) routes.push({i,j,t:0,d:clamp(8/V.exRate,0.55,2.6)});
  }
  for(let r=routes.length-1;r>=0;r--){ routes[r].t+=dt; if(routes[r].t>routes[r].d) routes.splice(r,1); }
}
function mPeople(dt){                       // 사람들은 틀 안의 제자리에 있고, 점의 크기가 가진 돈이다
  exStep(dt); const mean=CONFIG.exchange.initial, cnt=new Float32Array(MH.nb), pad=40;
  for(let i=0;i<N;i++){ spring(i,P.bx+pad+mapU[i]*(P.bw-2*pad)+Math.sin(T*0.3+sd[i]*50)*3,P.by+pad+mapV[i]*(P.bh-2*pad)+Math.cos(T*0.27+sd2[i]*50)*3,dt,1);
    const w=money[i]/mean; sizT[i]=clamp(1.4+3.2*Math.sqrt(w),1.4,72); colT[i]=clamp(0.3+0.28*w,0,1); alpT[i]=clamp(0.3+0.7*Math.sqrt(w),0.3,0.95);
    const b=(money[i]/MH.bw)|0; if(b<MH.nb) cnt[b]++; }
  for(let b=0;b<MH.nb;b++) monHist[b]+=(cnt[b]-monHist[b])*0.08;
}

/* =====================================================================
   모형 ⑥ ⑦  보스-아인슈타인 통계 (3차원 조화 트랩, 준위 QL개로 절단)
   평균 점유수 n̄(ε) = 1 / (e^{(ε-μ)/k_BT} - 1),  μ 는 Σ g_k n̄(ε_k) = N 으로 결정
   ===================================================================== */
const Q = { T:1, mu:-1, Tc:1, Tcur:CONFIG.quantum.temperature, g:new Float64Array(QL), nbar:new Float64Array(QL),
  occ:new Float64Array(QL), tgt:new Int32Array(QL), cnt:new Int32Array(QL), frac:new Float32Array(201), n0:0 };
for(let k=0;k<QL;k++) Q.g[k]=(k+1)*(k+2)/2;
const lev = new Int16Array(N), lrank = new Int32Array(N);
function beTotal(mu,T){ let s=0; for(let k=0;k<QL;k++) s+=Q.g[k]/Math.expm1((k-mu)/T); return s; }
function beSolve(T){ let lo=-80*T-80, hi=-1e-13;
  for(let it=0;it<90;it++){ const mid=(lo+hi)/2; if(beTotal(mid,T)>QN) hi=mid; else lo=mid; } return (lo+hi)/2; }
(function(){ // 모형의 임계온도: 들뜬 상태가 수용할 수 있는 최대 입자 수가 N 이 되는 온도
  const cap=T=>{let s=0;for(let k=1;k<QL;k++)s+=Q.g[k]/Math.expm1(k/T);return s;};
  let lo=0.05,hi=500; for(let it=0;it<80;it++){const m=(lo+hi)/2; if(cap(m)>QN)hi=m; else lo=m;} Q.Tc=(lo+hi)/2;
  Q.frac[0]=1; for(let j=1;j<=200;j++){ const T=j/100*Q.Tc, mu=beSolve(T); Q.frac[j]=1/Math.expm1(-mu/T)/QN; }
})();
function qUpdate(dt){
  Q.Tcur+=(V.qT-Q.Tcur)*(1-Math.exp(-dt*0.8)); Q.T=Math.max(0.02,Q.Tcur)*Q.Tc; Q.mu=beSolve(Q.T);
  let sum=0; for(let k=0;k<QL;k++){ Q.nbar[k]=1/Math.expm1((k-Q.mu)/Q.T); Q.occ[k]=Q.g[k]*Q.nbar[k]; Q.tgt[k]=Math.floor(Q.occ[k]); sum+=Q.tgt[k]; }
  Q.n0=Q.occ[0];
  for(let left=QN-sum;left>0;left--){ let bk=0,bf=-1; for(let k=0;k<QL;k++){const f=Q.occ[k]-Q.tgt[k]; if(f>bf){bf=f;bk=k;}} Q.tgt[bk]++; Q.occ[bk]-=1; }
  for(let k=0;k<QL;k++) Q.occ[k]=Q.g[k]*Q.nbar[k];
}
function levelsEnter(){ qUpdate(0); let i=0; for(let k=0;k<QL;k++) for(let c=0;c<Q.tgt[k]&&i<QN;c++) lev[i++]=k;
  for(;i<QN;i++) lev[i]=0;
  for(let a=QN-1;a>0;a--){ const b=(Math.random()*(a+1))|0, t=lev[a]; lev[a]=lev[b]; lev[b]=t; } }
function mLevels(dt){
  qUpdate(dt); const c=Q.cnt; c.fill(0); for(let i=0;i<QN;i++) c[lev[i]]++;
  let moves=Math.max(4,Math.round(14*dt*60)), start=(Math.random()*QN)|0;
  for(let q=0;q<QN&&moves>0;q++){ const i=(start+q)%QN, k=lev[i]; if(c[k]<=Q.tgt[k]) continue;
    let best=-1; for(let d=1;d<QL&&best<0;d++){ if(k-d>=0&&c[k-d]<Q.tgt[k-d]) best=k-d; else if(k+d<QL&&c[k+d]<Q.tgt[k+d]) best=k+d; }
    if(best<0) break; lev[i]=best; c[k]--; c[best]++; moves--; }
  if(Math.random()<clamp(Q.Tcur,0.05,1)*dt*60*0.8){ const a=(Math.random()*QN)|0,b=(Math.random()*QN)|0;
    if(Math.abs(lev[a]-lev[b])<=2){const t=lev[a];lev[a]=lev[b];lev[b]=t;} }      // 열적 요동(점유수는 그대로)
  c.fill(0); for(let i=0;i<QN;i++) lrank[i]=c[lev[i]]++;
  const s0=5+1.9*Math.sqrt(c[0]);
  for(let i=0;i<QN;i++){ const k=lev[i]; let X,Y;
    if(k===0){ X=TRAP.cx+g1[i]*s0; Y=TRAP.yb-4+g2[i]*s0*0.5; }       // 하나의 양자 상태에 겹쳐 쌓이는 보손
    else { const hw=levW(k)*0.9, pitch=Math.min(11,2*hw/c[k]); X=TRAP.cx+(lrank[i]-(c[k]-1)/2)*pitch; Y=levY(k)-5+Math.sin(T*2+sd[i]*30)*1.2; }
    spring(i,X,Y,dt,1.7); colT[i]=k===0?1:0.45; sizT[i]=3.2; alpT[i]=0.95; }
  for(let i=QN;i<N;i++){ spring(i,skyX[i],skyY[i],dt,0.7); alpT[i]=0.15; sizT[i]=1.5; colT[i]=0.5; }
}

/* =====================================================================
   그 밖의 입자 운동: 밤하늘 · 엔딩
   ===================================================================== */
function mSky(dt){
  for(let i=0;i<N;i++){
    spring(i,skyX[i]+Math.sin(T*0.07+sd[i]*40)*16,skyY[i]+Math.cos(T*0.05+sd2[i]*70)*9,dt,0.7);
    alpT[i]=(0.2+0.7*sd2[i])*(0.72+0.28*Math.sin(T*(0.5+sd[i])+sd[i]*90))*P.star;
    sizT[i]=0.9+1.7*sd[i]*sd[i]; colT[i]=0.5+0.5*sd2[i]; }
  if(P.tipA>0.5){ const p=hero.tip(); spring(0,p[0],p[1],dt,3); alpT[0]=1; sizT[0]=5; colT[0]=1; }
  if(P.tipB>0.5&&line2.b>0.02){ const p=line2.tip(); spring(1,p[0],p[1],dt,3); alpT[1]=1; sizT[1]=5; colT[1]=0.55; }
}
function scatterEnter(){ for(let i=0;i<N;i++){ const a=Math.atan2(py[i]-540,px[i]-960)+gauss()*0.9, s=(50+Math.random()*130)*CONFIG.particles.speed; vx[i]+=Math.cos(a)*s; vy[i]+=Math.sin(a)*s; } }
function mScatter(dt){
  for(let i=0;i<N;i++){ const a=T*0.4+sd[i]*30;
    ax[i]=Math.cos(a)*26-vx[i]*0.25+(px[i]<80?60:px[i]>W-80?-60:0); ay[i]=Math.sin(a*1.3)*26-vy[i]*0.25+(py[i]<80?60:py[i]>H-80?-60:0);
    vx[i]+=ax[i]*dt; vy[i]+=ay[i]*dt; px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
    colT[i]=0.6; sizT[i]=2.2; alpT[i]=0.85; }
}
const mrank = new Int32Array(N);
function mergeEnter(){ const idx=Array.from({length:N},(_,i)=>i).sort((a,b)=>px[a]-px[b]); idx.forEach((i,r)=>mrank[i]=r); }
function mMerge(dt){
  for(let i=0;i<N;i++){ spring(i,160+mrank[i]/(N-1)*1600,560,dt,0.62);
    const d=Math.abs(py[i]-560)+Math.abs(vy[i])*0.05; alpT[i]=clamp(d/50,0,0.9); sizT[i]=1.4+clamp(d/200,0,1); colT[i]=0.8; }
}
const MODES = { sky:mSky, gas:mGas, people:mPeople, levels:mLevels, scatter:mScatter, merge:mMerge };
function modeEnter(m, prev){
  if(m==='gas') gasEnter();
  else if(m==='levels'){ Q.Tcur=V.qT; levelsEnter(); }
  else if(m==='scatter'){ if(prev!=='merge') scatterEnter(); }
  else if(m==='merge') mergeEnter();
}

/* =====================================================================
   스플릿플랩 라벨 (A / B → 기체 분자 / 주식 시장)
   ===================================================================== */
const GLYPHS = '가나다라마바사아자차카타파하경제물리입자시장분포확률온도평균ABCDEFGHJKLMNPRSTXYZ0123456789';
class Flap{
  constructor(){ this.str=''; this.cells=[]; for(let i=0;i<5;i++) this.cells.push({ch:' ',nx:' ',tg:' ',n:0,p:0,w:0,wT:0,on:false}); }
  set(s){ if(s===this.str) return; this.str=s;
    this.cells.forEach((c,i)=>{ const ch=s[i]||' '; c.wT=i<s.length?1:0; if(ch!==c.tg){ c.tg=ch; c.n=5+i*3; } }); }
  update(dt){ const k=1-Math.exp(-dt*7);
    for(const c of this.cells){ c.w+=(c.wT-c.w)*k;
      if(c.wT===0&&c.w<0.04){ c.ch=c.tg=' '; c.n=0; c.on=false; c.p=0; continue; }
      if(c.n>0&&c.w>0.5){ if(!c.on){ c.on=true; c.p=0; c.nx=c.n===1?c.tg:GLYPHS[(Math.random()*GLYPHS.length)|0]; }
        c.p+=dt/0.08; if(c.p>=1){ c.ch=c.nx; c.p=0; c.on=false; c.n--; } } } }
  draw(x,y){ const cw=80,h=108,gap=8;
    for(const c of this.cells){ if(c.w<0.03) continue; const wd=cw*c.w; this.cell(c,x,y,wd,h); x+=(cw+gap)*c.w; } }
  cell(c,x,y,wd,h){
    ctx.globalAlpha=1; ctx.fillStyle='#14213f'; ctx.fillRect(x,y,wd,h);
    ctx.font='700 '+Math.round(h*0.6)+'px '+SANS; ctx.textAlign='center'; ctx.textBaseline='middle';
    const half=(ch,top,sy,panel)=>{ ctx.save(); ctx.beginPath(); ctx.rect(x,top?y:y+h/2,wd,h/2); ctx.clip(); ctx.translate(x+wd/2,y+h/2); ctx.scale(1,Math.max(0.001,sy));
      if(panel){ ctx.fillStyle='#1b2b52'; ctx.fillRect(-wd/2,top?-h/2:0,wd,h/2); }
      if(ch!==' '){ ctx.fillStyle='#fff'; ctx.fillText(ch,0,h*0.03); } ctx.restore(); };
    if(!c.on){ half(c.ch,true,1); half(c.ch,false,1); }
    else if(c.p<0.5){ half(c.nx,true,1); half(c.ch,false,1); half(c.ch,true,1-2*c.p,true); }
    else { half(c.nx,true,1); half(c.ch,false,1); half(c.nx,false,2*c.p-1,true); }
    ctx.fillStyle='#0a1530'; ctx.fillRect(x,y+h/2-1,wd,2);
  }
}

    {line:'refLine',texts:['refsTitle','refs'],P:{trail:0,light:1}} ],
  script:['입자들을 다시 풀어 준다. 하나하나가 어디로 갈지는 알 수 없다.',
    '(→) 모아 놓으면 하나의 선이 된다. 처음의 수평선이다.',
    '(→) 한 사람의 거래는 예측할 수 없다. 그러나 전체의 분포는 일정한 모양을 따른다. 오늘 본 모형들은 사람을 매우 단순하게 가정했다. 사람은 분자와 달리 판단하고 전략을 바꾼다. 그럼에도 단순한 규칙만으로 분포의 큰 윤곽을 설명할 수 있다는 것이 통계물리학이 경제를 바라보는 방식이다.',
    '(→) 참고문헌이다.'],
  caveats:['물리와 경제가 같다는 결론이 아니다. 미시적 무작위성에서 거시적 규칙성이 나오는 구조를 같은 수학으로 모형화할 수 있다는 것이다.',
    '모형의 공통 가정: 총자산 일정, 무작위 만남, 단순한 교환 규칙.'] }
];
const STEPS = [];
SCENES.forEach((sc, si) => { let acc = { mode:'sky', line:'horizon', line2:null, texts:[], fa:'', fb:'', v:{} };
  sc.steps.forEach((s, k) => { acc = { mode:s.mode||acc.mode, line:s.line||acc.line, line2:('line2' in s)?s.line2:acc.line2,
      texts:s.texts||acc.texts, fa:('fa' in s)?s.fa:acc.fa, fb:('fb' in s)?s.fb:acc.fb, v:Object.assign({},acc.v,s.v||{}), P:s.P||acc.P||{} };
    STEPS.push(Object.assign({ scene:si, k, n:sc.steps.length, reset:!!s.reset }, acc)); }); });

let cur = -1, notesWin = null;
function go(i){
  i = clamp(i, 0, STEPS.length-1); if(i===cur) return;
  const fwd = i>cur, s = STEPS[i], prevMode = mode; cur = i;
  Object.assign(V, s.v);
  if(s.reset && fwd) exReset();
  if(s.mode!==prevMode){ mode=s.mode; modeEnter(mode, prevMode); }
  hero.set(s.line); hero.aT=0; hero.bT=1;
  if(s.line2){ if(line2.b-line2.a<0.03){ line2.jump(s.line2); line2.a=line2.b=0; } else line2.set(s.line2); line2.aT=0; line2.bT=1; }
  else { line2.aT=0; line2.bT=0; }
  for(const id in TEXTS) TEXTS[id].el.classList.toggle('on', s.texts.indexOf(id)>=0);
  flapA.set(s.fa); flapB.set(s.fb);
  for(const k in DEF) PT[k] = (k in s.P) ? s.P[k] : DEF[k];
  stage.classList.toggle('light', PT.light>0.5); document.body.classList.toggle('light', PT.light>0.5);
  location.hash = 's' + i;
  updateMeta(true); updateNotes();
}
function adjust(d){
  const sc = STEPS[cur].scene;
  if(sc===1) V.gasT = clamp(V.gasT*(d>0?1.12:1/1.12), 0.15, 5);
  else if(sc===3) V.qT = clamp(V.qT*(d>0?1.07:1/1.07), 0.03, 2);
  else if(sc===2||sc===4) V.exRate = clamp(V.exRate*(d>0?1.6:1/1.6), 0.5, 20000);
}
function metaText(){   // 왼쪽 아래에는 참고문헌(과 자료 출처)만 표시한다
  const s = STEPS[cur], r = SCENES[s.scene].ref, t = r[Math.min(s.k, r.length-1)];
  if(t!=='@data') return t;
  return 'Bachelier (1900) · Einstein (1905) · '+(csvMode ? '주가: '+csvName : '주가: 시뮬레이션 (실제 지수 아님)')+' · 분자: 시뮬레이션';
}
let metaAcc = 0;
function updateMeta(force){
  if(cur<0) return; const s = STEPS[cur];
  const t = metaText(); if(mBL.textContent!==t) mBL.textContent = t;
}
function notesHTML(){
  const s = STEPS[cur], sc = SCENES[s.scene];
  return '<div class="k">발표자 노트 · 단계 '+(s.k+1)+'/'+s.n+' · → Space 다음 · ← 이전 · ↑↓ 매개변수 · F 전체 화면 · N 노트 · Shift+N 새 창 · 1–'+SCENES.length+' 장면 이동</div>'+
    '<h2>'+sc.title+'</h2><p><b>핵심</b> — '+sc.key+'</p><h3>대본 초안</h3>'+sc.script.map(p=>'<p>'+p+'</p>').join('')+
    '<h3>가정 · 한계 · 출처</h3><ul>'+sc.caveats.map(c=>'<li>'+c+'</li>').join('')+'</ul>';
}
function updateNotes(){
  const h = notesHTML(); notesEl.innerHTML = h;
  if(notesWin && !notesWin.closed){ try{ notesWin.document.getElementById('n').innerHTML = h; }catch(e){} }
}
function openNotesWindow(){
  try{ notesWin = window.open('', 'presenter-notes', 'width=720,height=820'); if(!notesWin) return;
    notesWin.document.title = '발표자 노트';
    notesWin.document.body.innerHTML = '<div id="n"></div>';
    notesWin.document.body.style.cssText = 'margin:0;padding:24px 30px;background:#0a1530;color:#dfe8f5;font:17px/1.75 '+SANS.replace(/"/g,"'");
    updateNotes(); }catch(e){}
}

/* ---------- 키보드 ---------- */
addEventListener('keydown', e => {
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const k = e.key; let used = true;
  if(k==='ArrowRight'||k===' '||k==='Spacebar'||k==='PageDown'||k==='Enter') go(cur+1);
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace') go(cur-1);
  else if(k==='ArrowUp') adjust(1);
  else if(k==='ArrowDown') adjust(-1);
  else if(k==='f'||k==='F'||k==='ㄹ'){ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }
  else if(k==='N'&&e.shiftKey) openNotesWindow();
  else if(k==='n'||k==='N'||k==='ㅜ') document.body.classList.toggle('notes');
  else if(k==='Home') go(0);
  else if(k==='End') go(STEPS.length-1);
  else if(/^[1-9]$/.test(k)){ const i=STEPS.findIndex(s=>s.scene===+k-1); if(i>=0) go(i); }
  else used = false;
  if(used) e.preventDefault();
});
let idleTimer = 0;
addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(()=>document.body.classList.add('idle'), 2000); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => applyCSV(String(r.result), f.name); r.readAsText(f); });

/* =====================================================================
   그리기
   ===================================================================== */
let INK = '#fff', SKY = 'rgb(140,196,238)';
const mix = (a, b, t) => 'rgb(' + Math.round(lerp(a[0],b[0],t)) + ',' + Math.round(lerp(a[1],b[1],t)) + ',' + Math.round(lerp(a[2],b[2],t)) + ')';
function rampColor(c){ // 0 깊은 하늘색 → 0.5 하늘색 → 1 흰색 (밝은 배경에서는 남색 계열)
  const d = c<0.5 ? [lerp(58,140,c*2),lerp(110,196,c*2),lerp(176,238,c*2)] : [lerp(140,255,c*2-1),lerp(196,255,c*2-1),lerp(238,255,c*2-1)];
  const n = [lerp(120,10,c),lerp(150,21,c),lerp(190,48,c)];
  return mix(d, n, lightK);
}
function label(s, x, y, size, a, align, weight){
  ctx.globalAlpha = a; ctx.font = (weight||500)+' '+size+'px '+SANS; ctx.textAlign = align||'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function seg(x0,y0,x1,y1){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); }
function hair(a, color, w){ ctx.globalAlpha=a; ctx.strokeStyle=color||SKY; ctx.lineWidth=w||1; ctx.stroke(); }

function drawBackground(){
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0,0,0,H), L = lightK;
  g.addColorStop(0, mix([6,13,32],[255,255,255],L)); g.addColorStop(0.6, mix([10,21,48],[255,255,255],L)); g.addColorStop(1, mix([12,25,56],[255,255,255],L));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(P.warm>0.01){ const y=hero.cur[LM+1]; const w = ctx.createLinearGradient(0,y-90,0,y+50);   // 수평선에만 쓰는 따뜻한 빛
    w.addColorStop(0,'rgba(255,196,140,0)'); w.addColorStop(0.64,'rgba(255,196,140,'+(0.11*P.warm)+')'); w.addColorStop(0.66,'rgba(255,196,140,'+(0.05*P.warm)+')'); w.addColorStop(1,'rgba(255,196,140,0)');
    ctx.fillStyle = w; ctx.fillRect(0,y-90,W,140); }
}
const LS = 28, LA = 0.9;                       // 그래프 인덱스 글자 크기 · 불투명도
function axes(x0, x1, base, a, xl, yl, ytop){   // 가로축 + 인덱스
  ctx.beginPath(); seg(x0,base+0.5,x0+(x1-x0)*a,base+0.5); hair(0.75*a,INK,1.5);
  ctx.fillStyle=INK; label(xl,x1,base+46,LS,LA*a,'right'); label('0',x0,base+46,LS,LA*a); label(yl,x0,ytop,LS,LA*a);
}
function drawDecor(){
  let a;
  /* 왼쪽 틀 (선이 곡선이 되어 떠난 뒤에도 남는다) */
  if((mode==='gas'||mode==='people') && hero.shape!=='box'){ ctx.beginPath(); ctx.rect(P.bx,P.by,P.bw,P.bh); hair(0.9,INK,2); }
  const bw=(GR.x1-GR.x0)/GH.nb;
  /* 기체: 속력 분포 */
  if((a=P.gasHist)>0.01){ ctx.globalAlpha=0.34*a; ctx.fillStyle=SKY;
    for(let b=0;b<GH.nb;b++){ const h=gasHist[b]*GH.scale*a; ctx.fillRect(GR.x0+b*bw+2,GR.base-h,bw-4,h); }
    axes(GR.x0,GR.x1,GR.base,a,'속력 →','분자 수',GR.base-400); }
  /* 사람: 돈 분포 (같은 자리) */
  if((a=P.mHist)>0.01){ ctx.globalAlpha=0.34*a; ctx.fillStyle=SKY;
    for(let b=0;b<MH.nb;b++){ const h=Math.min(520,monHist[b]*MH.px)*a; ctx.fillRect(GR.x0+b*bw+2,GR.base-h,bw-4,h); }
    axes(GR.x0,GR.x1,GR.base,a,'가진 돈 →','사람 수',GR.base-400);
    const ra=line2.b-line2.a; if(line2.shape==='maxwell'&&ra>0.5){ ctx.fillStyle=SKY; label('기체',GR.x0+(GR.x1-GR.x0)*0.167-64,GR.base-240,LS,LA*a*(ra-0.5)*2,'right'); }
    if(hero.shape==='theory'){ ctx.fillStyle=INK; label('사람',GR.x0+(GR.x1-GR.x0)*0.234+120,GR.base-240,LS,LA*a*EASE(hero.t),'left',600); } }
  /* 거래선 */
  if(routes.length && mode==='people'){ ctx.beginPath();
    for(const r of routes){ const x0=px[r.i],y0=py[r.i],x1=px[r.j],y1=py[r.j],d=Math.hypot(x1-x0,y1-y0),cxp=(x0+x1)/2,cyp=(y0+y1)/2-d*0.22;
      const p=r.t/r.d, hd=clamp(p*1.6,0,1), tl=clamp(p*1.6-0.6,0,1), n=14;
      for(let q=0;q<=n;q++){ const u=tl+(hd-tl)*q/n, w=1-u, X=w*w*x0+2*w*u*cxp+u*u*x1, Y=w*w*y0+2*w*u*cyp+u*u*y1; if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } }
    hair(0.55,SKY,1); }
  /* 에너지 준위 */
  if((a=P.trap)>0.01){ ctx.beginPath();
    for(let k=0;k<QL;k++){ const w=levW(k)*a, y=levY(k); seg(TRAP.cx-w,y,TRAP.cx+w,y); } hair(0.34*a,SKY,1);
    if(hero.shape!=='parabola'){ ctx.beginPath(); for(let q=0;q<=80;q++){ const s=-1+2*q/80, e=s*s*(QL-0.4)-0.6, X=TRAP.cx+s*TRAP.wmax, Y=TRAP.yb-e*TRAP.dy; if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } hair(0.45*a,INK,1.4); }
    ctx.fillStyle=INK; label('에너지 ↑',TRAP.cx-TRAP.wmax-20,levY(QL-1)-38,LS,LA*a);
    if(mode==='levels') label('바닥 상태  '+Q.cnt[0]+'개',TRAP.cx+levW(0)+76,levY(0)+44,LS,0.95*a,'left',600); }
  /* 바닥 상태 비율 – 온도 */
  if((a=P.plotFr)>0.01){ ctx.beginPath(); seg(PLOT.x0,PLOT.y1,PLOT.x0+(PLOT.x1-PLOT.x0)*a,PLOT.y1); seg(PLOT.x0,PLOT.y1,PLOT.x0,PLOT.y1-(PLOT.y1-PLOT.y0)*a); hair(0.75*a,INK,1.5);
    const xc=(PLOT.x0+PLOT.x1)/2; ctx.setLineDash([4,7]); ctx.beginPath(); seg(xc,PLOT.y1,xc,PLOT.y1-(PLOT.y1-PLOT.y0)*a); hair(0.5*a,SKY); ctx.setLineDash([]);
    ctx.fillStyle=INK; label('임계 온도',xc,PLOT.y1+46,LS,LA*a,'center'); label('0',PLOT.x0,PLOT.y1+46,LS,LA*a,'center'); label('온도 →',PLOT.x1,PLOT.y1+46,LS,LA*a,'right');
    label('100%',PLOT.x0-16,PLOT.y0+10,LS,LA*a,'right'); label('바닥 상태 입자의 비율',PLOT.x0,PLOT.y0-34,LS,LA*a);
    if(hero.shape==='frac'){ const f=EASE(hero.t)*a, X=PLOT.x0+clamp(Q.Tcur/2,0,1)*(PLOT.x1-PLOT.x0), Y=PLOT.y1-(Q.n0/QN)*(PLOT.y1-PLOT.y0);
      ctx.globalAlpha=f; ctx.beginPath(); ctx.arc(X,Y,9,0,6.2832); ctx.fill(); label(Math.round(Q.n0/QN*100)+'%',X+20,Y-16,34,0.95*f,'left',600); } }
  /* 이름표 옆 색 표시 */
  if(flapA.cells[0].w>0.03){ ctx.beginPath(); seg(SER.aX0,SER.fy-18,SER.aX0+70*flapA.cells[0].w,SER.fy-18); hair(1,INK,2.4); }
  if(flapB.cells[0].w>0.03){ ctx.beginPath(); seg(SER.bX0,SER.fy-18,SER.bX0+70*flapB.cells[0].w,SER.fy-18); hair(1,SKY,2.4); }
}
const bHead = new Int32Array(160), bNext = new Int32Array(N);
function drawParticles(){
  const L = Math.min(TL-1, Math.round(P.trail));
  if(L>=2){ ctx.beginPath();
    for(let i=0;i<N;i++){ if(alp[i]<0.1) continue; const b=i*TL*2, o=(th-L+TL)%TL, x0=trail[b+th*2], y0=trail[b+th*2+1], dx=x0-trail[b+o*2], dy=y0-trail[b+o*2+1];
      if(dx*dx+dy*dy<9) continue; ctx.moveTo(x0,y0); for(let k=1;k<=L;k++){ const j=(th-k+TL)%TL; ctx.lineTo(trail[b+j*2],trail[b+j*2+1]); } }
    hair(lerp(0.2,0.3,lightK), lightK>0.5?'rgb(10,21,48)':SKY, 1); }
  bHead.fill(-1);
  for(let i=0;i<N;i++){ if(alp[i]<0.03) continue; const b=Math.min(15,(col[i]*16)|0)*10+Math.min(9,(alp[i]*10)|0); bNext[i]=bHead[b]; bHead[b]=i; }
  for(let b=0;b<160;b++){ if(bHead[b]<0) continue;
    ctx.fillStyle=rampColor(((b/10|0)+0.5)/16); ctx.globalAlpha=Math.min(1,((b%10)+1)/10); ctx.beginPath();
    for(let i=bHead[b];i>=0;i=bNext[i]){ const x=px[i], y=py[i], r=siz[i]; ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832); }
    ctx.fill(); }
}

/* =====================================================================
   메인 루프 (requestAnimationFrame)
   ===================================================================== */
let last = 0, slowAcc = 0, slowN = 0, frames = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(now - last < 1000/CONFIG.performance.targetFPS - 3) return;
  let dt = (now - last)/1000; last = now; if(!(dt>0)) return; if(dt>0.05) dt = 0.05;
  T += dt;
  if(CONFIG.performance.adaptive){ slowAcc += dt; slowN++;      // 프레임이 떨어지면 캔버스 해상도를 단계적으로 낮춘다
    if(slowN>=45){ if(slowAcc/slowN > 1.45/CONFIG.performance.targetFPS && quality>0.4 && cv.width>960){ quality*=0.75; resize(); } slowAcc=0; slowN=0; } }
  const kp = 1-Math.exp(-dt*3.4);
  for(const k in P) P[k] += (PT[k]-P[k]) * (k==='light' ? 1-Math.exp(-dt*1.25) : kp);
  lightK = P.light;
  INK = mix([255,255,255],[10,21,48],lightK); SKY = mix([140,196,238],[70,104,156],lightK);

  tickSeries(dt);
  hero.update(dt); line2.update(dt); flapA.update(dt); flapB.update(dt);
  MODES[mode](dt);

  const kv = 1-Math.exp(-dt*5.5);
  th = (th+1)%TL;
  for(let i=0;i<N;i++){ col[i]+=(colT[i]-col[i])*kv; siz[i]+=(sizT[i]-siz[i])*kv; alp[i]+=(alpT[i]-alp[i])*kv;
    trail[(i*TL+th)*2]=px[i]; trail[(i*TL+th)*2+1]=py[i]; }

  ctx.setTransform(K,0,0,K,0,0);
  drawBackground(); drawDecor(); drawParticles();
  line2.draw(SKY, 1.8, 0.95);
  hero.draw(P.warm>0.01 ? mix([255,255,255],[255,214,170],P.warm) : INK, 2.3, P.lineA);
  if(flapA.cells[0].w>0.03) flapA.draw(SER.aX0,SER.fy);
  if(flapB.cells[0].w>0.03) flapB.draw(SER.bX0,SER.fy);
  ctx.globalAlpha = 1;

  metaAcc += dt; if(metaAcc>0.12){ metaAcc=0; updateMeta(false); }
  frames++;
}

/* ---------- 시작 ---------- */
(function boot(){
  const emb = document.getElementById('stock-csv').textContent.trim(); if(emb) applyCSV(emb, CONFIG.data.label);
  const m = /^#s(\d+)$/.exec(location.hash); const start = m ? clamp(+m[1],0,STEPS.length-1) : 0;
  go(0); if(start>0){ go(start); for(const k in P) P[k]=PT[k]; hero.jump(STEPS[start].line); }
  window.__deck = { go, adjust, applyCSV, STEPS, SCENES, CONFIG, V, P,
    state:()=>({ quality, backing:cv.width, step:cur, scene:STEPS[cur].scene, mode, frames, money:Array.from(money), gasTm, gasHist:Array.from(gasHist), monHist:Array.from(monHist), exCount, csvMode, light:lightK, qT:Q.Tcur, n0:Q.cnt[0], cnt:Array.from(Q.cnt) }) };
  requestAnimationFrame(t => { last = t - 16; requestAnimationFrame(frame); });
})();
</script>
