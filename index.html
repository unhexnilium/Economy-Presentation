<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통계물리학으로 바라보는 경제</title>
<style>
:root{
  --navy:#0a1530; --sky:#8cc4ee; --ink:#ffffff;
  --ease:cubic-bezier(.22,.75,.25,1.08); --dur:1200ms;
  --sans:Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding","Liberation Mono",monospace;
}
html,body{margin:0;height:100%;overflow:hidden;background:#070f24}
body{font-family:var(--sans);transition:background-color 1.8s linear}
body.light{background:#ffffff}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  color:var(--ink);transition:color 1.6s linear;transform:translate(-50%,-50%)}
#stage.light{color:var(--navy)}
#cv{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.t{position:absolute;overflow:hidden;white-space:nowrap;line-height:1.16;letter-spacing:-.045em;
  font-weight:300;padding:.06em .08em .1em .02em;pointer-events:none}
.t>span{display:inline-block;transform:translateY(118%);transition:transform 620ms cubic-bezier(.6,0,.85,.35)}
.t.on>span{transform:none;transition:transform var(--dur) var(--ease)}
.t b{font-weight:800}
.t.mono{font-family:var(--mono);letter-spacing:.08em;font-weight:500;opacity:.6}
.m{position:absolute;font:500 15px/1.5 var(--mono);letter-spacing:.09em;opacity:.5;white-space:nowrap;pointer-events:none}
#mTL{left:48px;top:40px}#mTR{right:48px;top:40px;text-align:right}
#mBL{left:48px;bottom:36px}#mBR{right:48px;bottom:36px;text-align:right}
.fx{font-family:"STIX Two Text","Times New Roman","Nimbus Roman",Times,serif;letter-spacing:0;font-weight:400}
.fx i{font-style:italic}.fx .ov{text-decoration:overline}
.fx .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin-left:.15em}
.fx .nu{border-bottom:2px solid currentColor;padding:0 .4em .02em}
.fx .de{padding:.06em .2em 0}
.fx sup{font-size:.58em}.fx sub{font-size:.6em}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:48vh;overflow:auto;box-sizing:border-box;
  background:rgba(6,12,30,.95);color:#dfe8f5;border-top:1px solid rgba(140,196,238,.35);
  font:400 16px/1.7 var(--sans);padding:18px 32px 26px;transform:translateY(102%);transition:transform .45s var(--ease);z-index:5}
body.notes #notes{transform:none}
#notes h2{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-.02em}
#notes h3{margin:12px 0 2px;font:600 12px var(--mono);letter-spacing:.12em;color:#8cc4ee}
#notes p{margin:4px 0}#notes ul{margin:4px 0;padding-left:20px}
#notes .k{font:500 12px var(--mono);letter-spacing:.1em;opacity:.6}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="m" id="mTL">STATISTICAL PHYSICS × ECONOMICS</div>
  <div class="m" id="mTR"></div>
  <div class="m" id="mBL"></div>
  <div class="m" id="mBR"></div>
</div>
<div id="notes"></div>

<!-- 실제 지수 데이터를 쓰려면 아래 블록 안에 CSV 텍스트를 붙여 넣는다 (또는 CSV 파일을 창에 끌어다 놓는다).
     헤더에 Close / 종가 / Price 열이 있으면 그 열을, 없으면 마지막 숫자 열을 사용한다. 행은 시간 오름차순. -->
<script id="stock-csv" type="text/plain"></script>

<script>
'use strict';
/* =====================================================================
   전역 설정 — 속도·이징·지속시간·입자 수·양자통계 매개변수는 여기서 수정
   ===================================================================== */
const CONFIG = {
  stage: { width: 1920, height: 1080 },

  particles: {
    count: 500,        // 전 장면에서 살아 있는 기본 입자 수
    speed: 1,          // 전체 운동 속도 배율
    trailLength: 40,   // 궤적 기록 길이(프레임)
    extended: 1000     // 03 장면에서 확장되는 최대 입자 수
  },

  animation: {
    duration: 1200,                    // 선 변형·텍스트 전환 시간(ms)
    easing: [0.22, 0.75, 0.25, 1.08],  // cubic-bezier (끝에서 약간 오버슈트)
    overshoot: 0.04                    // 입자 스프링의 오버슈트 비율
  },

  gas: { v0: 115, radius: 5, tStart: 1, tHot: 3.2, tCold: 0.35, tMin: 0.15, tMax: 5 },

  exchange: { initial: 100, rates: [1.5, 30, 300, 300], maxRoutes: 70 },

  ising: { tStart: 5, tCold: 1.5, tMin: 0.6, tMax: 6, field: 0 },

  quantum: {
    temperature: 1.8,   // 06 장면 시작 온도 (T / Tc 단위)
    tNear: 1.06,        // 06 마지막 단계 (임계온도 바로 위)
    tCond: 0.55,        // 07 응축 단계
    tDeep: 0.15,        // 07 깊은 응축
    energyLevels: 20,   // 에너지 준위 수 (3차원 조화 트랩, ε_k = k·ħω, 축퇴도 g_k=(k+1)(k+2)/2)
    particleCount: 500, // 보손 수 (입자 수보다 크면 입자 수로 제한)
    maxOccupation: 1000 // 분포 그래프 세로축(로그) 상한
  },

  data: { window: 400, column: '' },   // CSV 사용 시 표시할 최근 표본 수 / 열 이름 지정(선택)

  performance: { targetFPS: 60, maxDPR: 2, maxBackingWidth: 3840, adaptive: true }  // adaptive: 프레임이 떨어지면 캔버스 해상도를 단계적으로 낮춤
};

/* ---------- 유틸 ---------- */
const W = CONFIG.stage.width, H = CONFIG.stage.height;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srnd = mulberry32(20240917);            // 배치·시계열용 고정 시드 (발표마다 같은 그림)
function gauss(r){r=r||Math.random;let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*r())}
function bezierEase(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  return x=>{ if(x<=0)return 0; if(x>=1)return 1; let t=x;
    for(let i=0;i<8;i++){const f=((ax*t+bx)*t+cx)*t-x,d=(3*ax*t+2*bx)*t+cx; if(Math.abs(d)<1e-6)break; t-=f/d;}
    t=clamp(t,0,1); return ((ay*t+by)*t+cy)*t; };
}
const EASE = bezierEase.apply(null, CONFIG.animation.easing);
const SANS = 'Pretendard,"Pretendard Variable","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif';
const MONO = 'ui-monospace,"SF Mono",Menlo,Consolas,"D2Coding","Liberation Mono",monospace';
const SERIF = '"STIX Two Text","Times New Roman","Nimbus Roman",Times,serif';

/* ---------- DOM ---------- */
const stage = document.getElementById('stage'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mTR = document.getElementById('mTR'), mBL = document.getElementById('mBL'), mBR = document.getElementById('mBR');
const notesEl = document.getElementById('notes');
stage.style.setProperty('--ease', 'cubic-bezier(' + CONFIG.animation.easing.join(',') + ')');
stage.style.setProperty('--dur', CONFIG.animation.duration + 'ms');
let K = 1, quality = 1;
function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.performance.maxDPR);
  const bw = clamp(Math.round(W * s * dpr * quality), 640, CONFIG.performance.maxBackingWidth);
  if (cv.width !== bw){ cv.width = bw; cv.height = Math.round(bw * H / W); }
  K = bw / W;
}
addEventListener('resize', resize); resize();

/* =====================================================================
   입자 시스템 — 프레젠테이션 전체에서 단 하나의 인스턴스
   ===================================================================== */
const N = CONFIG.particles.count, CAP = Math.max(N, CONFIG.particles.extended), TL = CONFIG.particles.trailLength;
const F = () => new Float32Array(CAP);
const px=F(),py=F(),vx=F(),vy=F(),ax=F(),ay=F();           // 위치·속도·가속도
const col=F(),colT=F(),siz=F(),sizT=F(),alp=F(),alpT=F();   // 색상(0..1 램프)·크기·불투명도
const ang=F(),arw=F(),arwT=F();                             // 이동 방향·화살표 형태
const kf=F(),sd=F(),sd2=F(),g1=F(),g2=F();                  // 개체별 난수
const trail=new Float32Array(CAP*TL*2); let th=0;           // 궤적 기록(링 버퍼)
const st=new Uint8Array(CAP);
const skyX=F(),skyY=F(),mapX=F(),mapY=F(),avgX=F(),avgY=F(),gx=F(),gy=F(),uX=F(),uY=F();
const HORIZON = 640;

(function initParticles(){
  for(let i=0;i<CAP;i++){
    kf[i]=0.8+0.45*srnd(); sd[i]=srnd(); sd2[i]=srnd(); g1[i]=gauss(srnd); g2[i]=gauss(srnd);
    skyX[i]=40+srnd()*(W-80); skyY[i]=50+Math.pow(srnd(),1.25)*540;
    avgX[i]=150+srnd()*640; avgY[i]=210+srnd()*670;
    uX[i]=gauss(srnd); uY[i]=gauss(srnd);
  }
  avgX[0]=470; avgY[0]=545;
  // 항로 지도 노드: best-candidate 표본 추출로 고르게 배치
  for(let i=0;i<N;i++){
    let bx=0,by=0,bd=-1;
    for(let c=0;c<10;c++){
      const x=200+srnd()*1520,y=170+srnd()*670; let d=1e9;
      for(let j=0;j<i;j++){const dx=mapX[j]-x,dy=mapY[j]-y,q=dx*dx+dy*dy; if(q<d)d=q;}
      if(d>bd){bd=d;bx=x;by=y;}
    }
    mapX[i]=bx; mapY[i]=by;
  }
  for(let i=0;i<CAP;i++){
    const j=i<N?i:i-N; px[i]=skyX[j]; py[i]=skyY[j]; col[i]=colT[i]=0.6; siz[i]=sizT[i]=1.6; alp[i]=alpT[i]=i<N?0.4:0;
    for(let k=0;k<TL;k++){trail[(i*TL+k)*2]=px[i];trail[(i*TL+k)*2+1]=py[i];}
  }
})();

const OS = clamp(CONFIG.animation.overshoot, 0.001, 0.5), LOS = Math.log(OS);
const ZETA = -LOS / Math.sqrt(Math.PI*Math.PI + LOS*LOS);
const OMEGA = 6000 / CONFIG.animation.duration;
function spring(i, X, Y, dt, w){
  const o = OMEGA * kf[i] * (w || 1), c = 2 * ZETA * o;
  ax[i] = o*o*(X-px[i]) - c*vx[i]; ay[i] = o*o*(Y-py[i]) - c*vy[i];
  vx[i] += ax[i]*dt; vy[i] += ay[i]*dt; px[i] += vx[i]*dt; py[i] += vy[i]*dt;
}

/* ---------- 장면 매개변수 (연속적으로 보간) ---------- */
const DEF = { warm:0, light:0, trail:8, star:1, tipA:0, tipB:0, heroTrail:0, lineA:1,
  aX0:160,aX1:880,aCy:540,aAmp:170, bX0:1040,bX1:1760,bCy:540,bAmp:170,
  fAx:160,fAy:800,fBx:1040,fBy:800, sw:0,
  gasHist:0, exAxis:0, avgGraph:0, traces:0, avgAmp:26, incr:0, bonds:0, isGraph:0,
  trap:0, plotBE:0, plotFr:0, pairs:0 };
const P = Object.assign({}, DEF), PT = Object.assign({}, DEF);
const V = { gasT:1, exRate:1.5, avgN:1, isT:5, qT:CONFIG.quantum.temperature, rebel:false };
let mode = 'sky', T = 0, lightK = 0;

/* =====================================================================
   시계열 (00 · 04) — A: 브라운 운동, B: 주가 (CSV 없으면 시뮬레이션)
   ===================================================================== */
const LM = 400;
const serA = new Float32Array(LM), serB = new Float32Array(LM);
const nrmA = {m:0,r:1}, nrmB = {m:0,r:1};
let csvMode = false, csvName = '', csvCount = 0, serFrac = 0;
const gbm = { logS: 0, s2: 1, r: 0 };
function stepA(prev){ return prev + gauss(srnd); }
function stepB(){ // GARCH(1,1) 변동성을 갖는 기하 확률보행 (모의 주가)
  gbm.s2 = 0.06 + 0.10*gbm.r*gbm.r + 0.86*gbm.s2; gbm.r = Math.sqrt(gbm.s2)*gauss(srnd);
  gbm.logS += 0.011*gbm.r + 0.0002; return Math.exp(gbm.logS);
}
(function(){ let a=0; for(let i=0;i<LM;i++){a=stepA(a);serA[i]=a;serB[i]=stepB();} })();
function normOf(s, o, snap){
  let mn=1e30,mx=-1e30; for(let i=0;i<LM;i++){if(s[i]<mn)mn=s[i];if(s[i]>mx)mx=s[i];}
  const m=(mn+mx)/2, r=Math.max(1e-9,(mx-mn)/2);
  if(snap){o.m=m;o.r=r;} else {o.m+=(m-o.m)*0.06;o.r+=(r-o.r)*0.06;}
}
normOf(serA,nrmA,true); normOf(serB,nrmB,true);
function tickSeries(dt){
  normOf(serA,nrmA,false); normOf(serB,nrmB,false);
  if(csvMode){ serFrac=0; return; }
  serFrac += dt*9*CONFIG.particles.speed;
  while(serFrac>=1){ serFrac-=1; serA.copyWithin(0,1); serB.copyWithin(0,1);
    serA[LM-1]=stepA(serA[LM-2]); serB[LM-1]=stepB(); }
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];}
    else if(c!=='\r') cell+=c; }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  const num=s=>{const v=parseFloat(String(s).replace(/[,\s%₩$]/g,''));return isFinite(v)?v:NaN;};
  const data=rows.filter(r=>r.some(c=>c.trim()!=='')); if(data.length<3) return null;
  const head=data[0], hasHead=head.some(c=>isNaN(num(c))&&c.trim()!=='');
  let ci=-1;
  if(hasHead){ const want=CONFIG.data.column.toLowerCase();
    head.forEach((h,i)=>{const s=h.trim().toLowerCase(); if(want?s===want:/^(adj\.?\s*)?close$|종가|^price$|^value$|지수/.test(s)) ci=i;}); }
  const body=hasHead?data.slice(1):data;
  if(ci<0){ for(let i=body[0].length-1;i>=0;i--){ if(!isNaN(num(body[0][i]))&&!/^\d{4}[-/.]\d/.test(body[0][i].trim())){ci=i;break;} } }
  if(ci<0) return null;
  let vals=body.map(r=>num(r[ci])).filter(v=>!isNaN(v)&&v>0);
  const d0=Date.parse(body[0][0]), d1=Date.parse(body[body.length-1][0]);
  if(isFinite(d0)&&isFinite(d1)&&d0>d1) vals.reverse();      // 최신순 CSV면 뒤집는다
  return vals.length>=20?vals:null;
}
function applyCSV(text, name){
  const v=parseCSV(text); if(!v) return false;
  const w=v.slice(-Math.max(20,CONFIG.data.window));
  for(let i=0;i<LM;i++){ const p=i/(LM-1)*(w.length-1), a=Math.floor(p), b=Math.min(w.length-1,a+1); serB[i]=lerp(w[a],w[b],p-a); }
  csvMode=true; csvName=name||'embedded CSV'; csvCount=w.length; normOf(serB,nrmB,true); updateMeta(true); return true;
}

/* =====================================================================
   선 — 수평선 → 궤적 → 상자 → 축 → 그래프 → 밑줄 로 이어지는 하나의 선
   ===================================================================== */
const BOX = { x:200, y:200, w:860, h:700 };
const EXB = { x0:300, pitch:50, nb:26, bw:CONFIG.exchange.initial/5, base:900, dot:12, maxH:620 };
const GH = { x0:1190, x1:1790, base:880, nb:32, scale:1700 };
const AVG = { x0:900, x1:1780, cy:620, sc:84, H:360 };
const ISG = { x0:1250, x1:1790, cy:600, amp:230, H:360 };
const QL = CONFIG.quantum.energyLevels, QN = Math.min(N, CONFIG.quantum.particleCount);
const TRAP = { cx:580, yb:900, dy:Math.min(36, 684/(QL-1)), wmax:400 };
const PLOT = { x0:1180, x1:1780, y0:340, y1:830 };
const FLOW = { cx:960, cy:500, a:640, b:290 };
const INC = { x0:450, pitch:30, nb:34, bw:0.25, zmin:-4.25, axis:740, dot:12 };
const levY = k => TRAP.yb - k*TRAP.dy;
const levW = e => TRAP.wmax*Math.sqrt(Math.max(0,(e+0.6)/(QL-0.4)));
const LOGMAX = Math.log10(CONFIG.quantum.maxOccupation), LOGMIN = -3;
const mapLog = n => PLOT.y1 - (Math.log10(clamp(n,1e-3,CONFIG.quantum.maxOccupation))-LOGMIN)/(LOGMAX-LOGMIN)*(PLOT.y1-PLOT.y0);
const ring = (buf, head, len, p) => { const a=Math.floor(p), f=p-a, i0=(head+1+a)%len, i1=(head+1+Math.min(len-1,a+1))%len; return buf[i0]+(buf[i1]-buf[i0])*f; };

function seriesShape(o, s, nm, x0, x1, cy, amp){
  for(let i=0;i<LM;i++){ o[2*i]=x0+Math.max(0,(i-serFrac))/(LM-1)*(x1-x0); o[2*i+1]=cy-(s[i]-nm.m)/nm.r*amp; }
}
const SHAPES = {
  horizon(o){ for(let i=0;i<LM;i++){o[2*i]=-10+i/(LM-1)*(W+20);o[2*i+1]=HORIZON;} },
  serA(o){ seriesShape(o,serA,nrmA,P.aX0,P.aX1,P.aCy,P.aAmp); },
  serB(o){ seriesShape(o,serB,nrmB,P.bX0,P.bX1,P.bCy,P.bAmp); },
  box(o){ const per=2*(BOX.w+BOX.h);
    for(let i=0;i<LM;i++){ let d=i/(LM-1)*per,x,y;
      if(d<BOX.w){x=BOX.x+d;y=BOX.y;} else if((d-=BOX.w)<BOX.h){x=BOX.x+BOX.w;y=BOX.y+d;}
      else if((d-=BOX.h)<BOX.w){x=BOX.x+BOX.w-d;y=BOX.y+BOX.h;} else {d-=BOX.w;x=BOX.x;y=BOX.y+BOX.h-d;}
      o[2*i]=x;o[2*i+1]=y; } },
  maxwell(o){ const v0=CONFIG.gas.v0*CONFIG.particles.speed, vmax=6*v0, dv=vmax/GH.nb, s2=Math.max(0.02,gasTm)*v0*v0;
    for(let i=0;i<LM;i++){ const v=i/(LM-1)*vmax; o[2*i]=GH.x0+i/(LM-1)*(GH.x1-GH.x0);
      o[2*i+1]=GH.base-(v/s2)*Math.exp(-v*v/(2*s2))*dv*GH.scale; } },
  base02(o){ const x0=EXB.x0-24,x1=EXB.x0+EXB.nb*EXB.pitch+10; for(let i=0;i<LM;i++){o[2*i]=x0+i/(LM-1)*(x1-x0);o[2*i+1]=EXB.base+9;} },
  expCurve(o){ const Tm=CONFIG.exchange.initial, mmax=EXB.nb*EXB.bw;
    for(let i=0;i<LM;i++){ const m=i/(LM-1)*mmax; o[2*i]=EXB.x0+m/EXB.bw*EXB.pitch-6;
      o[2*i+1]=EXB.base-N*(EXB.bw/Tm)*Math.exp(-m/Tm)/3*EXB.dot; } },
  axis03(o){ for(let i=0;i<LM;i++){o[2*i]=AVG.x0+i/(LM-1)*(AVG.x1-AVG.x0);o[2*i+1]=AVG.cy;} },
  mean03(o){ for(let i=0;i<LM;i++){o[2*i]=AVG.x0+i/(LM-1)*(AVG.x1-AVG.x0);o[2*i+1]=AVG.cy-ring(avgMean,avgH,AVG.H,i/(LM-1)*(AVG.H-1))*AVG.sc;} },
  mag05(o){ for(let i=0;i<LM;i++){o[2*i]=ISG.x0+i/(LM-1)*(ISG.x1-ISG.x0);o[2*i+1]=ISG.cy-ring(isHist,isH,ISG.H,i/(LM-1)*(ISG.H-1))*ISG.amp;} },
  parabola(o){ for(let i=0;i<LM;i++){ const s=-1+2*i/(LM-1), e=s*s*(QL-0.4)-0.6; o[2*i]=TRAP.cx+s*TRAP.wmax; o[2*i+1]=TRAP.yb-e*TRAP.dy; } },
  beCurve(o){ for(let i=0;i<LM;i++){ const e=i/(LM-1)*(QL-1); o[2*i]=PLOT.x0+i/(LM-1)*(PLOT.x1-PLOT.x0); o[2*i+1]=mapLog(1/Math.expm1((e-Q.mu)/Q.T)); } },
  mbCurve(o){ for(let i=0;i<LM;i++){ const e=i/(LM-1)*(QL-1); o[2*i]=PLOT.x0+i/(LM-1)*(PLOT.x1-PLOT.x0); o[2*i+1]=mapLog(Math.exp(-(e-Q.mu)/Q.T)); } },
  frac(o){ for(let i=0;i<LM;i++){ const p=i/(LM-1)*200,a=Math.floor(p),b=Math.min(200,a+1); o[2*i]=PLOT.x0+i/(LM-1)*(PLOT.x1-PLOT.x0);
      o[2*i+1]=PLOT.y1-lerp(Q.frac[a],Q.frac[b],p-a)*(PLOT.y1-PLOT.y0); } },
  ellipse(o){ for(let i=0;i<LM;i++){ const a=i/(LM-1)*6.283185307-Math.PI/2; o[2*i]=FLOW.cx+Math.cos(a)*FLOW.a*0.72; o[2*i+1]=FLOW.cy+Math.sin(a)*FLOW.b*0.72; } },
  divider(o){ for(let i=0;i<LM;i++){o[2*i]=960;o[2*i+1]=170+i/(LM-1)*740;} },

class Line{

  update(dt){
    SHAPES[this.shape](this.tgt);

/* =====================================================================
   모형 ①  기체 상자 (탄성 충돌 + 온도 조절)
   ===================================================================== */
let gasTm = 1; const gasHist = new Float32Array(GH.nb);
const GC = CONFIG.gas.radius*2.2, gcols = Math.ceil(BOX.w/GC)+1, grows = Math.ceil(BOX.h/GC)+1;
const ghead = new Int32Array(gcols*grows), gnext = new Int32Array(CAP);
function gasEnter(){ st.fill(0); for(let i=0;i<N;i++){ gx[i]=BOX.x+20+Math.random()*(BOX.w-40); gy[i]=BOX.y+20+Math.random()*(BOX.h-40); } }
function collide(i,j){
  const dx=px[j]-px[i],dy=py[j]-py[i],d2=dx*dx+dy*dy,R2=4*CONFIG.gas.radius*CONFIG.gas.radius;
  if(d2>=R2||d2<1e-6) return; const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,rel=(vx[j]-vx[i])*nx+(vy[j]-vy[i])*ny;
  if(rel<0){ vx[i]+=rel*nx; vy[i]+=rel*ny; vx[j]-=rel*nx; vy[j]-=rel*ny; }
}
function mGas(dt){
  const v0=CONFIG.gas.v0*CONFIG.particles.speed, R=CONFIG.gas.radius; let ke=0,nf=0;
  const x0=BOX.x+R,x1=BOX.x+BOX.w-R,y0=BOX.y+R,y1=BOX.y+BOX.h-R;
  for(let i=0;i<N;i++){
    if(!st[i]){ spring(i,gx[i],gy[i],dt,1.3);
      const dx=gx[i]-px[i],dy=gy[i]-py[i];
      if(dx*dx+dy*dy<1600){ st[i]=1; const s=v0*Math.sqrt(V.gasT); vx[i]=gauss()*s; vy[i]=gauss()*s; } }
    else { px[i]+=vx[i]*dt; py[i]+=vy[i]*dt;
      if(px[i]<x0){px[i]=x0;vx[i]=Math.abs(vx[i]);} else if(px[i]>x1){px[i]=x1;vx[i]=-Math.abs(vx[i]);}
      if(py[i]<y0){py[i]=y0;vy[i]=Math.abs(vy[i]);} else if(py[i]>y1){py[i]=y1;vy[i]=-Math.abs(vy[i]);}
      ke+=0.5*(vx[i]*vx[i]+vy[i]*vy[i]); nf++; }
  }
  ghead.fill(-1);
  for(let i=0;i<N;i++){ if(!st[i]) continue; const c=clamp(((py[i]-BOX.y)/GC)|0,0,grows-1)*gcols+clamp(((px[i]-BOX.x)/GC)|0,0,gcols-1); gnext[i]=ghead[c]; ghead[c]=i; }
  for(let cy=0;cy<grows;cy++) for(let cx=0;cx<gcols;cx++){
    for(let i=ghead[cy*gcols+cx];i>=0;i=gnext[i]){
      for(let j=gnext[i];j>=0;j=gnext[j]) collide(i,j);
      if(cx+1<gcols) for(let j=ghead[cy*gcols+cx+1];j>=0;j=gnext[j]) collide(i,j);
      if(cy+1<grows){ for(let j=ghead[(cy+1)*gcols+cx];j>=0;j=gnext[j]) collide(i,j);
        if(cx>0) for(let j=ghead[(cy+1)*gcols+cx-1];j>=0;j=gnext[j]) collide(i,j);
        if(cx+1<gcols) for(let j=ghead[(cy+1)*gcols+cx+1];j>=0;j=gnext[j]) collide(i,j); }
    } }
  if(nf>0){ const Tm=ke/nf/(v0*v0); gasTm+=(Tm-gasTm)*0.2;       // 2차원: <½mv²> = k_B·T
    const lam=Math.sqrt(clamp(1+dt/0.45*(V.gasT/Math.max(Tm,1e-4)-1),0.7,1.5));
    for(let i=0;i<N;i++) if(st[i]){vx[i]*=lam;vy[i]*=lam;} }
  const cnt=new Float32Array(GH.nb), vmax=6*v0;
  for(let i=0;i<N;i++){ const s=Math.hypot(vx[i],vy[i]); if(st[i]){const b=(s/vmax*GH.nb)|0; if(b<GH.nb)cnt[b]++;}
    colT[i]=st[i]?clamp(Math.pow(s/(3.3*v0),0.85),0,1):0.6; sizT[i]=3.4; alpT[i]=0.95; arwT[i]=0; }
  for(let b=0;b<GH.nb;b++) gasHist[b]+=(cnt[b]/Math.max(1,nf)-gasHist[b])*0.07;
}

/* =====================================================================
   모형 ②  무작위 돈 교환 (총량 보존, 음수 불가)
   ===================================================================== */
const money = new Float64Array(N); let exCount = 0, exAcc = 0; const routes = [];
const exCnt = new Int32Array(EXB.nb), exRank = new Int32Array(N);
function exReset(){ money.fill(CONFIG.exchange.initial); exCount=0; exAcc=0; routes.length=0; }
exReset();
function exStep(dt){
  exAcc += V.exRate*dt*CONFIG.particles.speed; let budget=2;
  while(exAcc>=1){ exAcc-=1;
    const i=(Math.random()*N)|0; let j=(Math.random()*(N-1))|0; if(j>=i) j++;
    const tot=money[i]+money[j], e=Math.random();         // 두 주체의 합을 무작위 비율로 다시 나눈다
    money[i]=e*tot; money[j]=tot-money[i]; exCount++;
    if(budget-->0 && routes.length<CONFIG.exchange.maxRoutes) routes.push({i,j,t:0,d:clamp(8/V.exRate,0.55,2.6)});
  }
  for(let r=routes.length-1;r>=0;r--){ routes[r].t+=dt; if(routes[r].t>routes[r].d) routes.splice(r,1); }
}
function mExMap(dt){
  exStep(dt); const mean=CONFIG.exchange.initial;
  for(let i=0;i<N;i++){ spring(i,mapX[i]+Math.sin(T*0.3+sd[i]*50)*3,mapY[i]+Math.cos(T*0.27+sd2[i]*50)*3,dt,1);
    const w=money[i]/mean; sizT[i]=clamp(1.5+2.4*Math.sqrt(w),1.5,9); colT[i]=clamp(0.3+0.28*w,0,1); alpT[i]=0.95; arwT[i]=0; }
}
function mExHist(dt){
  exStep(dt); exCnt.fill(0);
  for(let i=0;i<N;i++){ const b=Math.min(EXB.nb-1,(money[i]/EXB.bw)|0); st[i]=b; exRank[i]=exCnt[b]++; }
  for(let i=0;i<N;i++){ const b=st[i], rows=Math.ceil(exCnt[b]/3), sp=Math.min(EXB.dot,EXB.maxH/Math.max(1,rows)), r=exRank[i];
    spring(i,EXB.x0+b*EXB.pitch+(r%3)*EXB.dot,EXB.base-6-((r/3)|0)*sp,dt,1.5);
    sizT[i]=4.2; colT[i]=clamp(0.3+b/EXB.nb*1.1,0,1); alpT[i]=0.95; arwT[i]=0; }
}

/* =====================================================================
   모형 ③  평균의 힘 (독립 OU 과정 N개의 표본 평균)
   ===================================================================== */
const avgMean = new Float32Array(AVG.H), avgTr = new Float32Array(40*AVG.H); let avgH = 0, avgAcc = 0, avgSince = 0;
function mAvg(dt){
  const n=Math.min(V.avgN,CAP), lim=n>N?CAP:N, thk=1.3*CONFIG.particles.speed, sq=Math.sqrt(2*thk*dt), amp=P.avgAmp;
  for(let i=0;i<lim;i++){
    uX[i]+=-thk*uX[i]*dt+sq*gauss(); uY[i]+=-thk*uY[i]*dt+sq*gauss();
    spring(i,avgX[i]+uX[i]*amp,avgY[i]-uY[i]*amp,dt,2.6);
    const on=i<n; alpT[i]=on?(n===1?1:0.9):(i<N?0.07:0); sizT[i]=(n===1&&i===0)?6:(n>N?2.3:3);
    colT[i]=i===0?1:0.5; arwT[i]=0;
  }
  avgAcc+=dt;
  if(avgAcc>=1/30){ avgAcc=0; let s=0; for(let i=0;i<n;i++) s+=uY[i];
    avgH=(avgH+1)%AVG.H; avgMean[avgH]=s/n; avgSince++;
    for(let j=0;j<40;j++) avgTr[j*AVG.H+avgH]=uY[j]; }
}
function avgStd(){ const m=clamp(avgSince,2,AVG.H); let s=0,q=0;
  for(let k=0;k<m;k++){const v=avgMean[(avgH-k+AVG.H)%AVG.H];s+=v;q+=v*v;} return Math.sqrt(Math.max(0,q/m-(s/m)*(s/m))); }

/* =====================================================================
   모형 ④  증분 분포 (04) — 두 시계열의 증분으로 만든 점 히스토그램
   ===================================================================== */
const incX = F(), incY = F(); let incAcc = 1;
function incAssign(){
  const half=N>>1, cnt=new Int32Array(INC.nb*2);
  for(let side=0;side<2;side++){
    const s=side?serB:serA, n=side?N-half:half, d=new Float32Array(LM-1); let m=0,q=0;
    for(let k=0;k<LM-1;k++){ d[k]=side?Math.log(s[k+1]/s[k]):s[k+1]-s[k]; m+=d[k]; }
    m/=LM-1; for(let k=0;k<LM-1;k++) q+=(d[k]-m)*(d[k]-m); const sdv=Math.sqrt(q/(LM-1))||1;
    for(let a=0;a<n;a++){ const i=side?half+a:a, z=(d[Math.floor(a*(LM-1)/n)]-m)/sdv;
      const b=clamp(Math.floor((z-INC.zmin)/INC.bw),0,INC.nb-1), r=cnt[side*INC.nb+b]++;
      incX[i]=INC.x0+b*INC.pitch+(r%2)*INC.dot+3; incY[i]=INC.axis+(side?1:-1)*(12+((r/2)|0)*INC.dot); }
  }
}
function mIncr(dt){
  incAcc+=dt; if(incAcc>0.6){incAcc=0;incAssign();}
  const half=N>>1;
  for(let i=0;i<N;i++){ spring(i,incX[i],incY[i],dt,1.4); colT[i]=i<half?1:0.42; sizT[i]=4; alpT[i]=0.95; arwT[i]=0; }
}

/* =====================================================================
   모형 ⑤  2차원 이징 모형 (메트로폴리스, 주기 경계)
   ===================================================================== */
const ICOLS = Math.max(2,Math.round(Math.sqrt(N*1.25))), IROWS = Math.max(2,Math.ceil(N/ICOLS)), ISITES = ICOLS*IROWS;
const ICELL = Math.min(900/ICOLS, 720/IROWS), IX0 = 600-ICOLS*ICELL/2+ICELL/2, IY0 = 545-IROWS*ICELL/2+ICELL/2;
const spin = new Int8Array(ISITES), isHist = new Float32Array(ISG.H); let isH = 0, isAcc = 0, isTcur = 5, isM = 0, isCarry = 0;
const ISING_TC = 2/Math.log(1+Math.SQRT2);     // 2.269…
function isingRandom(){ for(let i=0;i<ISITES;i++) spin[i]=Math.random()<0.5?1:-1; }
isingRandom();
function mIsing(dt){
  isTcur+=(V.isT-isTcur)*(1-Math.exp(-dt*0.9));
  const sweeps=(0.04+2.9*clamp((2.7-isTcur)/0.9,0,1))*CONFIG.particles.speed*Math.min(2,dt*60);
  isCarry+=sweeps*ISITES; const h=CONFIG.ising.field;
  while(isCarry>=1){ isCarry-=1; const i=(Math.random()*ISITES)|0,x=i%ICOLS,y=(i/ICOLS)|0,s=spin[i];
    const nb=spin[y*ICOLS+(x+1)%ICOLS]+spin[y*ICOLS+(x+ICOLS-1)%ICOLS]+spin[((y+1)%IROWS)*ICOLS+x]+spin[((y+IROWS-1)%IROWS)*ICOLS+x];
    const dE=2*s*(nb+h); if(dE<=0||Math.random()<Math.exp(-dE/isTcur)) spin[i]=-s; }
  let m=0; for(let i=0;i<ISITES;i++) m+=spin[i]; isM=m/ISITES;
  isAcc+=dt; if(isAcc>=1/30){isAcc=0;isH=(isH+1)%ISG.H;isHist[isH]=isM;}
  const k=1-Math.exp(-dt*16);
  for(let i=0;i<N;i++){ spring(i,IX0+(i%ICOLS)*ICELL,IY0+((i/ICOLS)|0)*ICELL,dt,1.2);
    const up=spin[i]>0; ang[i]+=((up?-Math.PI/2:Math.PI/2)-ang[i])*k;
    colT[i]=up?1:0.4; sizT[i]=3; alpT[i]=1; arwT[i]=1; }
}

/* =====================================================================
   모형 ⑥ ⑦  보스-아인슈타인 통계 (3차원 조화 트랩, 준위 QL개로 절단)
   평균 점유수 n̄(ε) = 1 / (e^{(ε-μ)/k_BT} - 1),  μ 는 Σ g_k n̄(ε_k) = N 으로 결정
   ===================================================================== */
const Q = { T:1, mu:-1, Tc:1, Tcur:CONFIG.quantum.temperature, g:new Float64Array(QL), nbar:new Float64Array(QL),
  occ:new Float64Array(QL), tgt:new Int32Array(QL), cnt:new Int32Array(QL), frac:new Float32Array(201), n0:0 };
for(let k=0;k<QL;k++) Q.g[k]=(k+1)*(k+2)/2;
const lev = new Int16Array(CAP), lrank = new Int32Array(CAP);
function beTotal(mu,T){ let s=0; for(let k=0;k<QL;k++) s+=Q.g[k]/Math.expm1((k-mu)/T); return s; }
function beSolve(T){ let lo=-80*T-80, hi=-1e-13;
  for(let it=0;it<90;it++){ const mid=(lo+hi)/2; if(beTotal(mid,T)>QN) hi=mid; else lo=mid; } return (lo+hi)/2; }
(function(){ // 모형의 임계온도: 들뜬 상태가 수용할 수 있는 최대 입자 수가 N 이 되는 온도
  const cap=T=>{let s=0;for(let k=1;k<QL;k++)s+=Q.g[k]/Math.expm1(k/T);return s;};
  let lo=0.05,hi=500; for(let it=0;it<80;it++){const m=(lo+hi)/2; if(cap(m)>QN)hi=m; else lo=m;} Q.Tc=(lo+hi)/2;
  Q.frac[0]=1; for(let j=1;j<=200;j++){ const T=j/100*Q.Tc, mu=beSolve(T); Q.frac[j]=1/Math.expm1(-mu/T)/QN; }
})();
function qUpdate(dt){
  Q.Tcur+=(V.qT-Q.Tcur)*(1-Math.exp(-dt*1.1)); Q.T=Math.max(0.02,Q.Tcur)*Q.Tc; Q.mu=beSolve(Q.T);
  let sum=0; for(let k=0;k<QL;k++){ Q.nbar[k]=1/Math.expm1((k-Q.mu)/Q.T); Q.occ[k]=Q.g[k]*Q.nbar[k]; Q.tgt[k]=Math.floor(Q.occ[k]); sum+=Q.tgt[k]; }
  Q.n0=Q.occ[0];
  for(let left=QN-sum;left>0;left--){ let bk=0,bf=-1; for(let k=0;k<QL;k++){const f=Q.occ[k]-Q.tgt[k]; if(f>bf){bf=f;bk=k;}} Q.tgt[bk]++; Q.occ[bk]-=1; }
  for(let k=0;k<QL;k++) Q.occ[k]=Q.g[k]*Q.nbar[k];
}
function levelsEnter(){ qUpdate(0); let i=0; for(let k=0;k<QL;k++) for(let c=0;c<Q.tgt[k]&&i<QN;c++) lev[i++]=k;
  for(;i<QN;i++) lev[i]=0;
  for(let a=QN-1;a>0;a--){ const b=(Math.random()*(a+1))|0, t=lev[a]; lev[a]=lev[b]; lev[b]=t; } }
function mLevels(dt){
  qUpdate(dt); const c=Q.cnt; c.fill(0); for(let i=0;i<QN;i++) c[lev[i]]++;
  let moves=Math.max(4,Math.round(14*dt*60)), start=(Math.random()*QN)|0;
  for(let q=0;q<QN&&moves>0;q++){ const i=(start+q)%QN, k=lev[i]; if(c[k]<=Q.tgt[k]) continue;
    let best=-1; for(let d=1;d<QL&&best<0;d++){ if(k-d>=0&&c[k-d]<Q.tgt[k-d]) best=k-d; else if(k+d<QL&&c[k+d]<Q.tgt[k+d]) best=k+d; }
    if(best<0) break; lev[i]=best; c[k]--; c[best]++; moves--; }
  if(Math.random()<clamp(Q.Tcur,0.05,1)*dt*60*0.8){ const a=(Math.random()*QN)|0,b=(Math.random()*QN)|0;
    if(Math.abs(lev[a]-lev[b])<=2){const t=lev[a];lev[a]=lev[b];lev[b]=t;} }      // 열적 요동(점유수는 그대로)
  c.fill(0); for(let i=0;i<QN;i++) lrank[i]=c[lev[i]]++;
  const s0=5+1.9*Math.sqrt(c[0]);
  for(let i=0;i<QN;i++){ const k=lev[i]; let X,Y;
    if(k===0){ X=TRAP.cx+g1[i]*s0; Y=TRAP.yb-4+g2[i]*s0*0.5; }       // 하나의 양자 상태에 겹쳐 쌓이는 보손
    else { const hw=levW(k)*0.9, pitch=Math.min(11,2*hw/c[k]); X=TRAP.cx+(lrank[i]-(c[k]-1)/2)*pitch; Y=levY(k)-5+Math.sin(T*2+sd[i]*30)*1.2; }
    spring(i,X,Y,dt,1.7); colT[i]=k===0?1:0.45; sizT[i]=2.7; alpT[i]=0.95; arwT[i]=0; }
  for(let i=QN;i<N;i++){ spring(i,skyX[i],skyY[i],dt,0.7); alpT[i]=0.15; sizT[i]=1.5; colT[i]=0.5; arwT[i]=0; }
}

/* =====================================================================
   그 밖의 입자 운동: 밤하늘 · 흐름 · 대응 관계 · 엔딩
   ===================================================================== */
function mSky(dt){
  for(let i=0;i<N;i++){
    spring(i,skyX[i]+Math.sin(T*0.07+sd[i]*40)*16,skyY[i]+Math.cos(T*0.05+sd2[i]*70)*9,dt,0.7);

class Flap{
  constructor(){ this.str=''; this.cells=[]; for(let i=0;i<5;i++) this.cells.push({ch:' ',nx:' ',tg:' ',n:0,p:0,w:0,wT:0,on:false}); }
  set(s){ if(s===this.str) return; this.str=s;
    this.cells.forEach((c,i)=>{ const ch=s[i]||' '; c.wT=i<s.length?1:0; if(ch!==c.tg){ c.tg=ch; c.n=5+i*3; } }); }
  update(dt){ const k=1-Math.exp(-dt*7);
    for(const c of this.cells){ c.w+=(c.wT-c.w)*k;
      if(c.wT===0&&c.w<0.04){ c.ch=c.tg=' '; c.n=0; c.on=false; c.p=0; continue; }
      if(c.n>0&&c.w>0.5){ if(!c.on){ c.on=true; c.p=0; c.nx=c.n===1?c.tg:GLYPHS[(Math.random()*GLYPHS.length)|0]; }
        c.p+=dt/0.08; if(c.p>=1){ c.ch=c.nx; c.p=0; c.on=false; c.n--; } } } }
  draw(x,y){ const cw=80,h=108,gap=8;
    for(const c of this.cells){ if(c.w<0.03) continue; const wd=cw*c.w; this.cell(c,x,y,wd,h); x+=(cw+gap)*c.w; } }
  cell(c,x,y,wd,h){

    ctx.font='700 '+Math.round(h*0.6)+'px '+SANS; ctx.textAlign='center'; ctx.textBaseline='middle';
    const half=(ch,top,sy,panel)=>{ ctx.save(); ctx.beginPath(); ctx.rect(x,top?y:y+h/2,wd,h/2); ctx.clip(); ctx.translate(x+wd/2,y+h/2); ctx.scale(1,Math.max(0.001,sy));
      if(panel){ ctx.fillStyle='#1b2b52'; ctx.fillRect(-wd/2,top?-h/2:0,wd,h/2); }
      if(ch!==' '){ ctx.fillStyle='#fff'; ctx.fillText(ch,0,h*0.03); } ctx.restore(); };

    ctx.fillStyle='#0a1530'; ctx.fillRect(x,y+h/2-1,wd,2);
  }
}

const STEPS = [];

      texts:s.texts||acc.texts, fa:('fa' in s)?s.fa:acc.fa, fb:('fb' in s)?s.fb:acc.fb, v:Object.assign({},acc.v,s.v||{}), rtl:!!s.rtl||acc.rtl, P:s.P||acc.P||{} };

let cur = -1, notesWin = null;
function go(i){
  i = clamp(i, 0, STEPS.length-1); if(i===cur) return;
  const fwd = i>cur, s = STEPS[i], prevMode = mode; cur = i;
  const prevN = V.avgN; Object.assign(V, s.v); if(V.avgN!==prevN) avgSince = 0;
  if(s.mode!==prevMode){ mode=s.mode; modeEnter(mode, prevMode, fwd); }
  hero.set(s.line); hero.aT=0; hero.bT=1;
  if(s.line2){ if(line2.b-line2.a<0.03){ line2.jump(s.line2); line2.a=line2.b=s.rtl?1:0; } else line2.set(s.line2); line2.aT=0; line2.bT=1; }
  else { line2.aT=0; line2.bT=0; }
  for(const id in TEXTS) TEXTS[id].el.classList.toggle('on', s.texts.indexOf(id)>=0);
  flapA.set(s.fa); flapB.set(s.fb);
  for(const k in DEF) PT[k] = (k in s.P) ? s.P[k] : DEF[k];
  stage.classList.toggle('light', PT.light>0.5); document.body.classList.toggle('light', PT.light>0.5);
  location.hash = 's' + i;
  updateMeta(true); updateNotes();
}
function adjust(d){
  const sc = STEPS[cur].scene, f = d>0?1.12:1/1.12;
  if(sc===1) V.gasT = clamp(V.gasT*f, CONFIG.gas.tMin, CONFIG.gas.tMax);
  else if(sc===2) V.exRate = clamp(V.exRate*(d>0?1.6:1/1.6), 0.5, 2000);
  else if(sc===3){ const o=[1,10,100,1000], k=o.indexOf(V.avgN); V.avgN=o[clamp((k<0?0:k)+d,0,o.length-1)]; avgSince=0; }
  else if(sc===5) V.isT = clamp(V.isT+d*0.15, CONFIG.ising.tMin, CONFIG.ising.tMax);
  else if(sc===6||sc===7) V.qT = clamp(V.qT*(d>0?1.07:1/1.07), 0.03, 2);
  else CONFIG.particles.speed = clamp(CONFIG.particles.speed*f, 0.25, 3);
  updateMeta(true);
}

  else if(k==='ArrowUp') adjust(1);
  else if(k==='ArrowDown') adjust(-1);
  else if(k==='f'||k==='F'||k==='ㄹ'){ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }
  else if(k==='N'&&e.shiftKey) openNotesWindow();
  else if(k==='n'||k==='N'||k==='ㅜ') document.body.classList.toggle('notes');
  else if(k==='Home') go(0);
  else if(k==='End') go(STEPS.length-1);
  else if(/^[0-9]$/.test(k)){ const i=STEPS.findIndex(s=>s.scene===+k); if(i>=0) go(i); }
  else used = false;
  if(used) e.preventDefault();
});
let idleTimer = 0;
addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(()=>document.body.classList.add('idle'), 2000); });

  const r = new FileReader(); r.onload = () => applyCSV(String(r.result), f.name); r.readAsText(f); });

/* =====================================================================
   그리기
   ===================================================================== */
let INK = '#fff', SKY = 'rgb(140,196,238)';
const mix = (a, b, t) => 'rgb(' + Math.round(lerp(a[0],b[0],t)) + ',' + Math.round(lerp(a[1],b[1],t)) + ',' + Math.round(lerp(a[2],b[2],t)) + ')';
function rampColor(c){ // 0 깊은 하늘색 → 0.5 하늘색 → 1 흰색 (밝은 배경에서는 남색 계열)
  const d = c<0.5 ? [lerp(58,140,c*2),lerp(110,196,c*2),lerp(176,238,c*2)] : [lerp(140,255,c*2-1),lerp(196,255,c*2-1),lerp(238,255,c*2-1)];
  const n = [lerp(120,10,c),lerp(150,21,c),lerp(190,48,c)];
  return mix(d, n, lightK);
}
function label(s, x, y, size, a, align, font, weight){
  ctx.globalAlpha = a; ctx.font = (weight||500)+' '+size+'px '+(font||MONO); ctx.textAlign = align||'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function seg(x0,y0,x1,y1){ ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); }
function hair(a, color, w){ ctx.globalAlpha=a; ctx.strokeStyle=color||SKY; ctx.lineWidth=w||1; ctx.stroke(); }

function drawBackground(){
  ctx.globalAlpha = 1;
  const g = ctx.createLinearGradient(0,0,0,H), L = lightK;
  g.addColorStop(0, mix([6,13,32],[255,255,255],L)); g.addColorStop(0.6, mix([10,21,48],[255,255,255],L)); g.addColorStop(1, mix([12,25,56],[255,255,255],L));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  if(P.warm>0.01){ const y=hero.cur[LM+1]; const w = ctx.createLinearGradient(0,y-90,0,y+50);   // 수평선에만 쓰는 따뜻한 빛
    w.addColorStop(0,'rgba(255,196,140,0)'); w.addColorStop(0.64,'rgba(255,196,140,'+(0.11*P.warm)+')'); w.addColorStop(0.66,'rgba(255,196,140,'+(0.05*P.warm)+')'); w.addColorStop(1,'rgba(255,196,140,0)');
    ctx.fillStyle = w; ctx.fillRect(0,y-90,W,140); }
}
function drawDecor(){
  ctx.fillStyle = INK; let a;

  if((a=P.gasHist)>0.01){ const bw=(GH.x1-GH.x0)/GH.nb; ctx.globalAlpha=0.3*a; ctx.fillStyle=SKY;
    for(let b=0;b<GH.nb;b++){ const h=gasHist[b]*GH.scale*a; ctx.fillRect(GH.x0+b*bw+2,GH.base-h,bw-4,h); }

    ctx.fillStyle=INK; label('속력 →',GH.x1,GH.base+30,15,0.5*a,'right'); label('0',GH.x0,GH.base+30,15,0.5*a); }

    for(const r of routes){ const x0=px[r.i],y0=py[r.i],x1=px[r.j],y1=py[r.j],d=Math.hypot(x1-x0,y1-y0),cxp=(x0+x1)/2,cyp=(y0+y1)/2-d*0.22;
      const p=r.t/r.d, hd=clamp(p*1.6,0,1), tl=clamp(p*1.6-0.6,0,1), n=14;
      for(let q=0;q<=n;q++){ const u=tl+(hd-tl)*q/n, w=1-u, X=w*w*x0+2*w*u*cxp+u*u*x1, Y=w*w*y0+2*w*u*cyp+u*u*y1; if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } }

    const xm=EXB.x0+CONFIG.exchange.initial/EXB.bw*EXB.pitch-6; ctx.beginPath(); seg(xm,EXB.base+9,xm,EXB.base+9+14*a); hair(0.7*a,INK); label('평균',xm,EXB.base+40,15,0.5*a,'center'); }
  /* 03 표본 평균 그래프 */
  if((a=P.avgGraph)>0.01){ ctx.beginPath(); seg(AVG.x0,AVG.cy,AVG.x0+(AVG.x1-AVG.x0)*a,AVG.cy); hair(0.22*a,INK);
    const n=Math.max(1,V.avgN), b=AVG.sc/Math.sqrt(n); ctx.setLineDash([4,7]); ctx.beginPath(); seg(AVG.x0,AVG.cy-b,AVG.x1,AVG.cy-b); seg(AVG.x0,AVG.cy+b,AVG.x1,AVG.cy+b); hair(0.4*a,SKY); ctx.setLineDash([]);
    ctx.fillStyle=INK; label('±1/√N',AVG.x1,AVG.cy-b-8,14,0.5*a,'right'); label('시간 →',AVG.x1,AVG.cy+AVG.sc*3.3,15,0.45*a,'right');
    if(P.traces>0.01){ ctx.beginPath();
      for(let j=0;j<Math.min(40,V.avgN);j++){ for(let q=0;q<AVG.H;q+=2){ const X=AVG.x0+q/(AVG.H-1)*(AVG.x1-AVG.x0), Y=AVG.cy-avgTr[j*AVG.H+(avgH+1+q)%AVG.H]*AVG.sc; if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } }

  /* 04 증분 분포 */
  if((a=P.incr)>0.01){ const x0=INC.x0-10,x1=INC.x0+INC.nb*INC.pitch+4, half=N>>1; ctx.beginPath(); seg(x0,INC.axis,x0+(x1-x0)*a,INC.axis); hair(0.5*a,INK);
    ctx.beginPath(); for(let sgn=-1;sgn<=1;sgn+=2){ for(let q=0;q<=120;q++){ const z=INC.zmin+q/120*INC.nb*INC.bw, X=INC.x0+(z-INC.zmin)/INC.bw*INC.pitch+8,
        rows=half*INC.bw*Math.exp(-z*z/2)/2.5066/2, Y=INC.axis+sgn*(8+rows*INC.dot*a); if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } }
    hair(0.55*a,SKY,1);
    ctx.fillStyle=INK; label('A · 변위 증분 Δx',x0-16,INC.axis-34,15,0.55*a,'right'); label('B · 로그수익률 Δln S',x0-16,INC.axis+46,15,0.55*a,'right');
    label('정규분포',x1+14,INC.axis+5,14,0.45*a); }
  /* 04 겹침 범례 */
  if((a=P.sw)>0.01){ ctx.beginPath(); seg(P.fAx,P.fAy-18,P.fAx+70*a,P.fAy-18); hair(a,INK,2.4); ctx.beginPath(); seg(P.fBx,P.fBy-18,P.fBx+70*a,P.fBy-18); hair(a,SKY,2.4); }
  /* 05 이웃 결합 + 자화 그래프 */
  if((a=P.bonds)>0.01 && mode==='ising'){ ctx.beginPath();
    for(let i=0;i<N;i++){ const c=i%ICOLS, r=(i/ICOLS)|0;
      if(c+1<ICOLS&&i+1<N&&spin[i]===spin[i+1]) seg(px[i],py[i],px[i+1],py[i+1]);
      if(r+1<IROWS&&i+ICOLS<N&&spin[i]===spin[i+ICOLS]) seg(px[i],py[i],px[i+ICOLS],py[i+ICOLS]); }
    hair(0.24*a,SKY,1); }
  if((a=P.isGraph)>0.01){ ctx.beginPath(); seg(ISG.x0,ISG.cy,ISG.x0+(ISG.x1-ISG.x0)*a,ISG.cy); hair(0.3*a,INK);
    ctx.setLineDash([4,7]); ctx.beginPath(); seg(ISG.x0,ISG.cy-ISG.amp,ISG.x1,ISG.cy-ISG.amp); seg(ISG.x0,ISG.cy+ISG.amp,ISG.x1,ISG.cy+ISG.amp); hair(0.3*a,SKY); ctx.setLineDash([]);
    ctx.fillStyle=INK; label('+1  모두 ↑',ISG.x1,ISG.cy-ISG.amp-10,14,0.5*a,'right'); label('−1  모두 ↓',ISG.x1,ISG.cy+ISG.amp+24,14,0.5*a,'right');
    label('평균 방향 M',ISG.x0,ISG.cy-ISG.amp-10,14,0.5*a); }
  /* 06 · 07 트랩과 에너지 준위 */
  if((a=P.trap)>0.01){ ctx.beginPath();
    for(let k=0;k<QL;k++){ const w=levW(k)*a, y=levY(k); seg(TRAP.cx-w,y,TRAP.cx+w,y); } hair(0.3*a,SKY,1);
    ctx.beginPath(); for(let q=0;q<=80;q++){ const s=-1+2*q/80, e=s*s*(QL-0.4)-0.6, X=TRAP.cx+s*TRAP.wmax, Y=TRAP.yb-e*TRAP.dy; if(q) ctx.lineTo(X,Y); else ctx.moveTo(X,Y); } hair(0.28*a,INK,1);
    ctx.fillStyle=INK;
    if(mode==='levels'){ for(let k=1;k<QL;k++) label(String(Q.cnt[k]),TRAP.cx+levW(k)+14,levY(k)+5,13,0.5*a);
      label('N₀ = '+Q.cnt[0],TRAP.cx-levW(0)-96,levY(0)+34,26,0.9*a,'right',MONO,600); }
    label('ε₀',TRAP.cx-levW(0)-34,levY(0)+5,15,0.6*a,'left',SERIF); label('ε'+String(QL-1).replace(/\d/g,d=>'₀₁₂₃₄₅₆₇₈₉'[d]),TRAP.cx-levW(QL-1)-44,levY(QL-1)+5,15,0.6*a,'left',SERIF);
    label('에너지 ↑',TRAP.cx-TRAP.wmax-30,levY(QL-1)-34,14,0.45*a); }
  /* 06 n̄(ε) 로그 그래프 */
  if((a=P.plotBE)>0.01){ ctx.beginPath(); seg(PLOT.x0,PLOT.y1,PLOT.x0+(PLOT.x1-PLOT.x0)*a,PLOT.y1); seg(PLOT.x0,PLOT.y1,PLOT.x0,PLOT.y1-(PLOT.y1-PLOT.y0)*a); hair(0.5*a,INK);
    ctx.fillStyle=INK; ctx.beginPath();
    for(let d=LOGMIN;d<=LOGMAX;d++){ const y=mapLog(Math.pow(10,d)); seg(PLOT.x0-7,y,PLOT.x0,y); label(d===0?'1':'10'+String(d).replace('-','⁻').replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]),PLOT.x0-14,y+5,13,0.5*a,'right'); }
    hair(0.5*a,INK);
    ctx.setLineDash([3,7]); ctx.beginPath(); seg(PLOT.x0,mapLog(1),PLOT.x1,mapLog(1)); hair(0.25*a,SKY); ctx.setLineDash([]);
    label('ε / ħω',PLOT.x1,PLOT.y1+34,17,0.6*a,'right',SERIF); label('0',PLOT.x0,PLOT.y1+30,13,0.5*a,'center'); label(String(QL-1),PLOT.x1,PLOT.y1+16,13,0.5*a,'center');
    label('n̄  (로그 눈금)',PLOT.x0-14,PLOT.y0-22,15,0.55*a,'right');
    if(hero.shape==='beCurve'&&hero.t>0.6){ const f=(hero.t-0.6)/0.4*a; ctx.globalAlpha=f; ctx.fillStyle=INK; ctx.beginPath();
      for(let k=0;k<QL;k++){ const X=PLOT.x0+k/(QL-1)*(PLOT.x1-PLOT.x0), Y=mapLog(Q.nbar[k]), r=k===0?5.5:2.6; ctx.moveTo(X+r,Y); ctx.arc(X,Y,r,0,6.2832); } ctx.fill();
      label('BE',PLOT.x0+16,mapLog(Q.nbar[0])-12,15,0.8*f,'left',MONO,600); label('n̄₀ = '+(Q.nbar[0]<100?Q.nbar[0].toFixed(1):Math.round(Q.nbar[0])),PLOT.x0+56,mapLog(Q.nbar[0])-12,15,0.6*f);
      const ra=line2.b-line2.a; if(line2.shape==='mbCurve'&&ra>0.5){ ctx.fillStyle=SKY; label('MB',PLOT.x0+16,Math.min(PLOT.y1-10,mapLog(Math.exp(Q.mu/Q.T))+26),15,0.9*f*(ra-0.5)*2,'left',MONO,600); } } }
  /* 07 응축 비율 */
  if((a=P.plotFr)>0.01){ ctx.beginPath(); seg(PLOT.x0,PLOT.y1,PLOT.x0+(PLOT.x1-PLOT.x0)*a,PLOT.y1); seg(PLOT.x0,PLOT.y1,PLOT.x0,PLOT.y1-(PLOT.y1-PLOT.y0)*a); hair(0.5*a,INK);
    const xc=(PLOT.x0+PLOT.x1)/2; ctx.setLineDash([4,7]); ctx.beginPath(); seg(xc,PLOT.y1,xc,PLOT.y1-(PLOT.y1-PLOT.y0)*a); hair(0.35*a,SKY); ctx.setLineDash([]);
    ctx.fillStyle=INK; label('T_c',xc,PLOT.y1+30,15,0.6*a,'center',SERIF); label('0',PLOT.x0,PLOT.y1+30,13,0.5*a,'center'); label('T →',PLOT.x1,PLOT.y1+30,14,0.5*a,'right');
    label('1',PLOT.x0-14,PLOT.y0+5,13,0.5*a,'right'); label('N₀ / N',PLOT.x0-14,PLOT.y0-22,15,0.55*a,'right');
    if(hero.shape==='frac'){ const f=EASE(hero.t)*a, X=PLOT.x0+clamp(Q.Tcur/2,0,1)*(PLOT.x1-PLOT.x0), Y=PLOT.y1-(Q.n0/QN)*(PLOT.y1-PLOT.y0);
      ctx.globalAlpha=f; ctx.beginPath(); ctx.arc(X,Y,7,0,6.2832); ctx.fill(); label((Q.n0/QN*100).toFixed(0)+'%',X+16,Y-12,20,0.9*f,'left',MONO,600); } }
  /* 08 대응 관계 도형 */
  if((a=P.pairs)>0.01){ ctx.beginPath();
    for(let r=0;r<3;r++){ const y=PAIR_Y[r]; seg(960-165*a,y,960+165*a,y); }
    for(let k=0;k<6;k++){ const y=PAIR_Y[1]+72-k*26; seg(630-110*a,y,630+110*a,y); }
    seg(1290-112,PAIR_Y[1]+73,1290-112+224*a,PAIR_Y[1]+73);
    seg(1290-150,PAIR_Y[2]+26,1290-150+300*a,PAIR_Y[2]+26); seg(1290-75,PAIR_Y[2]-30*a,1290-75,PAIR_Y[2]+34);
    ctx.rect(630-78*a,PAIR_Y[2]-64*a,156*a,128*a);
    hair(0.4*a,SKY,1);
    ctx.fillStyle=INK; const s=['PARTICLE','PERSON','ENERGY ε','MONEY m','TEMPERATURE T','MEAN WEALTH ⟨m⟩'];
    for(let r=0;r<3;r++){ label(s[2*r],196,PAIR_Y[r]+86,14,0.5*a); label(s[2*r+1],W-196,PAIR_Y[r]+86,14,0.5*a,'right'); }
    label('⟨m⟩',1290-75,PAIR_Y[2]-40,14,0.6*a,'center'); }
}
const bHead = new Int32Array(160), bNext = new Int32Array(CAP);
function drawParticles(lim){
  const L = Math.min(TL-1, Math.round(P.trail));
  if(L>=2){ ctx.beginPath();
    for(let i=0;i<lim;i++){ if(alp[i]<0.1) continue; const b=i*TL*2, o=(th-L+TL)%TL, x0=trail[b+th*2], y0=trail[b+th*2+1], dx=x0-trail[b+o*2], dy=y0-trail[b+o*2+1];
      if(dx*dx+dy*dy<9) continue; ctx.moveTo(x0,y0); for(let k=1;k<=L;k++){ const j=(th-k+TL)%TL; ctx.lineTo(trail[b+j*2],trail[b+j*2+1]); } }
    hair(lerp(0.2,0.3,lightK), lightK>0.5?'rgb(10,21,48)':SKY, 1); }
  if(P.heroTrail>1){ const n=Math.min(TL-1,Math.round(P.heroTrail)); ctx.beginPath(); ctx.moveTo(trail[th*2],trail[th*2+1]);
    for(let k=1;k<=n;k++){ const j=(th-k+TL)%TL; ctx.lineTo(trail[j*2],trail[j*2+1]); } hair(0.75,INK,1.6); }
  bHead.fill(-1);
  for(let i=0;i<lim;i++){ if(alp[i]<0.03) continue; const b=Math.min(15,(col[i]*16)|0)*10+Math.min(9,(alp[i]*10)|0); bNext[i]=bHead[b]; bHead[b]=i; }
  for(let b=0;b<160;b++){ if(bHead[b]<0) continue;
    ctx.fillStyle=rampColor(((b/10|0)+0.5)/16); ctx.globalAlpha=Math.min(1,((b%10)+1)/10); ctx.beginPath();
    for(let i=bHead[b];i>=0;i=bNext[i]){ const x=px[i], y=py[i], r=siz[i], w=arw[i];
      if(w<0.06){ ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832); }
      else { const c=Math.cos(ang[i]), s=Math.sin(ang[i]), Lh=r*(1+2.7*w), hw=r*(1+0.25*w);
        ctx.moveTo(x+c*Lh,y+s*Lh); ctx.lineTo(x-c*Lh*0.75-s*hw,y-s*Lh*0.75+c*hw); ctx.lineTo(x-c*Lh*0.75+s*hw,y-s*Lh*0.75-c*hw); ctx.closePath(); } }
    ctx.fill(); }
}

/* =====================================================================
   메인 루프 (requestAnimationFrame)
   ===================================================================== */
let last = 0, extraOn = false, slowAcc = 0, slowN = 0;
function frame(now){
  requestAnimationFrame(frame);
  if(now - last < 1000/CONFIG.performance.targetFPS - 3) return;
  let dt = (now - last)/1000; last = now; if(!(dt>0)) return; if(dt>0.05) dt = 0.05;
  T += dt;
  if(CONFIG.performance.adaptive){ slowAcc += dt; slowN++;
    if(slowN>=45){ if(slowAcc/slowN > 1.45/CONFIG.performance.targetFPS && quality>0.4 && cv.width>960){ quality*=0.75; resize(); } slowAcc=0; slowN=0; } }
  const kp = 1-Math.exp(-dt*3.4);
  for(const k in P) P[k] += (PT[k]-P[k]) * (k==='light' ? 1-Math.exp(-dt*1.25) : kp);
  lightK = P.light;
  INK = mix([255,255,255],[10,21,48],lightK); SKY = mix([140,196,238],[70,104,156],lightK);

  tickSeries(dt);
  if(mode!=='levels' && (P.plotBE>0.01||P.plotFr>0.01||P.trap>0.01)) qUpdate(dt);
  hero.update(dt); line2.update(dt); flapA.update(dt); flapB.update(dt);
  MODES[mode](dt);

  // 확장 입자(03 장면): 쓰지 않을 때는 짝 입자에 겹쳐 대기
  const useExtra = mode==='avg' && V.avgN>N; extraOn = useExtra;
  if(!useExtra && CAP>N){ for(let i=N;i<CAP;i++){ alpT[i]=0; if(alp[i]>0.02){ spring(i,px[i-N],py[i-N],dt,1.6); extraOn=true; } else { px[i]=px[i-N]; py[i]=py[i-N]; vx[i]=vy[i]=0; } } }
  const lim = extraOn ? CAP : N, kv = 1-Math.exp(-dt*5.5);
  th = (th+1)%TL;
  for(let i=0;i<lim;i++){ col[i]+=(colT[i]-col[i])*kv; siz[i]+=(sizT[i]-siz[i])*kv; alp[i]+=(alpT[i]-alp[i])*kv; arw[i]+=(arwT[i]-arw[i])*kv;
    trail[(i*TL+th)*2]=px[i]; trail[(i*TL+th)*2+1]=py[i]; }

  ctx.setTransform(K,0,0,K,0,0);
  drawBackground(); drawDecor(); drawParticles(lim);
  line2.draw(SKY, 1.8, 0.95);
  hero.draw(P.warm>0.01 ? mix([255,255,255],[255,214,170],P.warm) : INK, 2.3, P.lineA);
  if(flapA.cells[0].w>0.03) flapA.draw(P.fAx,P.fAy);
  if(flapB.cells[0].w>0.03) flapB.draw(P.fBx,P.fBy);
  ctx.globalAlpha = 1;

  metaAcc += dt; if(metaAcc>0.12){ metaAcc=0; updateMeta(false); }
  frames++;
}
let frames = 0;

/* ---------- 시작 ---------- */
(function boot(){
  const emb = document.getElementById('stock-csv').textContent.trim(); if(emb) applyCSV(emb, 'embedded CSV');
  const m = /^#s(\d+)$/.exec(location.hash); const start = m ? clamp(+m[1],0,STEPS.length-1) : 0;
  go(0); if(start>0){ for(const k in P) P[k]=PT[k]; go(start); for(const k in P) P[k]=PT[k]; hero.jump(STEPS[start].line); }
  window.__deck = { go, next:()=>go(cur+1), prev:()=>go(cur-1), adjust, applyCSV, STEPS, SCENES, CONFIG, V, P, Q,
    state:()=>({ quality, backing:cv.width, step:cur, scene:STEPS[cur].scene, mode, frames, money:Array.from(money), isM, isT:isTcur, gasTm, qT:Q.Tcur, mu:Q.mu, Tc:Q.Tc, cnt:Array.from(Q.cnt), nbar:Array.from(Q.nbar), avgStd:avgStd(), csvMode, lim:extraOn?CAP:N, light:lightK }) };
  requestAnimationFrame(t => { last = t - 16; requestAnimationFrame(frame); });
